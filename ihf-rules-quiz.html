<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IHF Rules Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#161a22;--mut:#667085;--bd:#d9dde5;--ac:#1d4ed8;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#eceff4;--mut:#98a2b3;--bd:#2d3342;--ac:#6b9bff;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#eceff4;--mut:#98a2b3;--bd:#2d3342;--ac:#6b9bff;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:.9rem}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600;margin-top:8px}
.btn:disabled{opacity:.4}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
.opt b{min-width:1.2em}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.score{font-size:3rem;font-weight:700;text-align:center;margin:4px 0}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.rv{border-left:4px solid var(--no)}.rv.good{border-left-color:var(--ok)}
.li{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:.95rem}
.li.c{background:var(--okb)}.li.w{background:var(--nob)}
.tag{font-size:.75rem;font-weight:700;margin-left:6px}
</style></head><body><main id="app"></main>
<script>
const Q=[{"id":"1.1","q":"¿Cuáles son las medidas del terreno de juego indicadas por las Reglas de Juego?","o":{"a":"40 x 20 metros","b":"42 x 20 metros","c":"38 x 18 metros","d":"Largo entre 38 y 42 metros, ancho entre 18 y 22 metros"},"a":["a"]},{"id":"1.2","q":"¿Cuáles son las medidas interiores de la portería?","o":{"a":"1,92 x 2,92 metros","b":"2,00 x 3,00 metros","c":"2,05 x 3,05 metros","d":"2,08 x 3,08 metros"},"a":["b"]},{"id":"1.3","q":"¿Cuál es el ancho de la línea de gol entre los postes de la portería?","o":{"a":"5cm","b":"6cm","c":"8cm","d":"10cm"},"a":["c"]},{"id":"1.4","q":"¿Qué afirmaciones son correctas sobre el área del saque de centro?","o":{"a":"Consiste en un círculo de 3 metros de diámetro","b":"Consiste en un círculo de 4 metros de diámetro","c":"El área del saque de centro puede ser de un color diferente al terreno de juego","d":"El área del saque de centro puede ser una línea circular","e":"El área del saque de centro es obligatoria en todos los eventos de balonmano"},"a":["b","c","d"]},{"id":"2.1","q":"El portero BLANCO 1 para un lanzamiento y el balón sale por la línea exterior de gol fuera de la portería justo antes de la señal final automática del marcador mural. Los árbitros se dan cuenta de que el partido ha terminado cinco minutos antes de tiempo. Como los jugadores aún están en la pista, se reanuda el juego con:","o":{"a":"Saque de portería para equipo BLANCO","b":"Golpe franco para equipo BLANCO","c":"Sin toque de silbato","d":"Después de toque de silbato"},"a":["a","d"]},{"id":"2.2","q":"Después de sonar la señal automática de final del primer tiempo, el árbitro se da cuenta inmediatamente que la primera parte ha finalizado un minuto antes. ¿Decisión correcta?","o":{"a":"Prolongar 1 minuto el segundo tiempo","b":"Se pierde ese minuto y no puede ser recuperado","c":"Después del primer tiempo, primero se juega 1 minuto en las mismas posiciones que en el primer tiempo, luego se cambian de campo y comienza el segundo tiempo","d":"Retener a los jugadores en el terreno de juego y jugar el minuto restante"},"a":["d"]},{"id":"2.3","q":"BLANCO 11 efectúa un lanzamiento a portería. El portero NEGRO 1 recepciona el balón. Justo en ese momento suena la señal automática de final de partido. Los árbitros señalan al cronometrador que todavía quedan 30 segundos de la segunda parte del partido. Todos los jugadores están todavía en el terreno de juego. ¿Cómo debe reanudarse el partido?","o":{"a":"Golpe franco para equipo NEGRO","b":"Saque de portería para equipo NEGRO","c":"Golpe franco para equipo BLANCO","d":"Después del toque de silbato","e":"Sin toque de silbato"},"a":["b","d"]},{"id":"2.4","q":"El equipo BLANCO va a ejecutar un golpe franco después de la señal de final de partido. Con este fin, primero BLANCO 3 y después BLANCO 4, abandonan el terreno de juego y son sustituidos en primer lugar por BLANCO 5 y posteriormente por BLANCO 6, quienes entran en el terreno de juego. ¿Cuál(es) de las siguientes afirmación(es) es/son correcta(s)?","o":{"a":"El cronometrador hace sonar el silbato e indica que se ha producido un cambio antirreglamentario del equipo BLANCO","b":"Exclusión de 2 minutos para BLANCO 4 por cambio antirreglamentario","c":"Exclusión de 2 minutos para BLANCO 6 por cambio antirreglamentario","d":"No hay ninguna razón para que el cronometrador haga sonar el silbato","e":"Golpe franco para el equipo BLANCO","f":"Golpe franco para el equipo NEGRO"},"a":["a","c","e"]},{"id":"2.5","q":"El equipo NEGRO ejecuta un golpe franco como un lanzamiento directo a portería, poco antes del final del partido. La señal final automática suena justo antes de que el balón entre en la portería. ¿Decisión correcta?","o":{"a":"Final de partido","b":"Repetición del golpe franco para el equipo NEGRO sin toque de silbato","c":"Repetición del golpe franco para el equipo NEGRO con toque de silbato","d":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["c"]},{"id":"2.6","q":"Justo antes del final del partido, NEGRO 2 recibe el balón junto a la línea del área de portería del equipo BLANCO y tiene una clara ocasión de gol. Intenta marcar gol pero se lo impiden haciéndole una falta. Antes que el balón abandone la mano de NEGRO 2, suena la señal de final de partido. ¿Decisión correcta?","o":{"a":"Final del partido","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Final del partido e informe escrito"},"a":["c"]},{"id":"2.7","q":"Poco antes de finalizar el primer tiempo, el equipo BLANCO tiene que ejecutar un lanzamiento de 7 metros. El lanzamiento realizado por BLANCO 9 golpea en el larguero, luego en la espalda del portero, que está aproximadamente a 3 metros por delante de su portería, y luego entra en la portería. La señal del cronometrador suena justo cuando el balón iba desde el larguero a la espalda del portero. ¿Cuál es la decisión correcta?","o":{"a":"Gol","b":"Repetición del lanzamiento de 7 metros","c":"Final del primer tiempo; ninguna otra decisión"},"a":["b"]},{"id":"2.8","q":"Después de finalizar el tiempo de juego, todavía tiene que ejecutarse un lanzamiento de 7 metros. Los árbitros esperan por el resultado inmediato del lanzamiento. ¿Qué árbitro debería entonces dar por finalizado el partido?","o":{"a":"El árbitro designado en primer lugar","b":"Uno de los dos árbitros","c":"El árbitro de centro","d":"El árbitro de portería"},"a":["b"]},{"id":"2.9","q":"¿Cuándo comienza el partido?","o":{"a":"Cuando el árbitro designado en primer lugar hace sonar su silbato","b":"Cuando el balón abandona la mano del lanzador","c":"Cuando el cronometrador pone en marcha el cronómetro o el reloj oficial","d":"Después del toque de silbato del árbitro central para ejecutar el saque de centro"},"a":["d"]},{"id":"2.10","q":"Para un desempate por medio de lanzamientos de 7 metros, ¿quién decide qué portería debe usarse?","o":{"a":"El equipo que gana el sorteo","b":"El equipo que pierde el sorteo","c":"Los árbitros","d":"El árbitro designado en primer lugar"},"a":["c"]},{"id":"2.11","q":"Un golpe franco para el equipo NEGRO debe ejecutarse después de la señal de final de partido. Antes de su ejecución, BLANCO 8 y BLANCO 9 abandonan el terreno de juego al mismo tiempo. Son sustituidos primero por BLANCO 10 e inmediatamente después por BLANCO 11. ¿Cuál(es) de las siguientes respuestas es/son correcta(s)?","o":{"a":"El cronometrador pita e indica a los árbitros que ha habido un cambio antirreglamentario del equipo BLANCO.","b":"Exclusión para BLANCO 10 por cambio antirreglamentario","c":"Exclusión para BLANCO 11 por cambio antirreglamentario","d":"El cronometrador no pita dado que no hay ninguna infracción","e":"BLANCO 11 debe volver a la zona de cambios; o BLANCO 8 o BLANCO 9 deben regresar al terreno de juego"},"a":["a","b","e"]},{"id":"2.12","q":"Justo antes de finalizar el primer tiempo, BLANCO 7 agrede a NEGRO 5 destruyendo así una clara ocasión de gol. La señal automática suena antes de que el árbitro tenga tiempo de pitar. ¿Decisión correcta?","o":{"a":"La primera parte ha finalizado; no hay sanción progresiva para BLANCO 7","b":"La primera parte ha finalizado; no es posible señalar ni golpe franco ni lanzamiento de 7 metros","c":"Descalificación para BLANCO 7, informe escrito (tarjetas roja y la azul mostradas por los árbitros)","d":"Lanzamiento de 7 metros para el equipo NEGRO","e":"Descalificación para BLANCO 7 (tarjeta roja mostrada por los árbitros)"},"a":["c","d"]},{"id":"2.13","q":"¿Hasta cuándo puede un árbitro anular un gol que ya ha sido concedido?","o":{"a":"Hasta el toque de silbato para el saque de centro","b":"Hasta el toque de silbato para el final de partido","c":"Debe anularse si fue conseguido después de que el cronometrador interrumpiera el juego, aunque el saque de centro se hubiera ejecutado antes de la interrupción","d":"No se puede anular nunca"},"a":["a","c"]},{"id":"2.14","q":"Los árbitros acaban de señalar un saque de banda para el equipo BLANCO. En ese momento, el oficial responsable del equipo BLANCO solicita un Tiempo Muerto de Equipo. ¿Cuál(es) de las siguientes situación(es) es/son correcta(s)?","o":{"a":"El Tiempo Muerto de Equipo no es posible, dado que el balón no está en juego","b":"El cronometrador hace sonar la señal, detiene el cronometro, y realiza la Gestoforma N.º 15","c":"Los árbitros confirman el Tiempo Muerto de Equipo para el equipo BLANCO","d":"El anotador anota el Tiempo Muerto de Equipo en el acta del partido"},"a":["b","c","d"]},{"id":"2.15","q":"¿En qué situaciones es obligatorio un Tiempo Muerto?","o":{"a":"Lanzamiento de 7 metros","b":"Exclusión de 2 minutos","c":"Influencias externas","d":"Descalificación"},"a":["b","d"]},{"id":"2.16","q":"BLANCO 9 lanza a portería. El portero NEGRO 12 recoge el balón. En ese instante, el cronometrador señala el final del partido. Los árbitros indican al cronometrador que todavía faltan 30 segundos del segundo tiempo. Todos los jugadores están en el terreno de juego. ¿Cómo debe reanudarse el encuentro?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Saque de portería para el equipo NEGRO","c":"Golpe franco para el equipo BLANCO","d":"Es necesario toque de silbato para reanudar el juego"},"a":["b","d"]},{"id":"2.17","q":"Después de finalizar el tiempo habitual de juego con el resultado 20-20, el partido debe continuar hasta determinar un ganador. ¿Decisión correcta?","o":{"a":"1 minuto de descanso antes de que la prórroga comience","b":"5 minutos de descanso antes de que la prórroga comience","c":"1 minuto de descanso al final de la primera parte de la prórroga","d":"5 minutos de descanso al final de la primera parte de la prórroga"},"a":["b","c"]},{"id":"2.18","q":"¿En cuáles de las siguientes situaciones es obligatorio un Tiempo Muerto?","o":{"a":"Exclusión de 2 minutos","b":"Golpe franco","c":"Juego pasivo","d":"Cambio antirreglamentario","e":"Amonestación","f":"Saque de banda"},"a":["a","d"]},{"id":"2.19","q":"¿A quién no se le permite participar en los lanzamientos de 7 metros cuando el partido está todavía empatado después de las prórrogas?","o":{"a":"Un jugador que insulta a los árbitros justo después de que la prórroga haya finalizado","b":"Los porteros","c":"Un jugador cuya exclusión de 2 minutos no ha finalizado al final de la prórroga","d":"Un jugador descalificado","e":"Un jugador que ha recibido atención médica en la pista y aun no se han producido tres ataques de su equipo"},"a":["a","c","d"]},{"id":"2.20","q":"El portero BLANCO 12 para un lanzamiento 5 segundos antes de finalizar el partido. El balón toca el techo sobre el área de portería. La señal automática de final de partido suena inmediatamente antes de que el saque de banda sea ejecutado por el equipo NEGRO. ¿Decisión correcta?","o":{"a":"Saque de banda para el equipo NEGRO después del toque de silbato","b":"Tiempo Muerto","c":"Final del partido","d":"Esperar al resultado del saque de banda; después el partido termina"},"a":["c"]},{"id":"2.21","q":"NEGRO 8 ya ha recibido una amonestación. Durante un Tiempo Muerto de Equipo, NEGRO 8 está sentado en el banquillo y se dirige a los árbitros de manera antideportiva. ¿Decisión correcta?","o":{"a":"Descalificación para NEGRO 8 (los árbitros muestran la tarjeta roja)","b":"Exclusión de 2 minutos para NEGRO 8","c":"Amonestación para NEGRO 8","d":"Ninguna acción es posible","e":"El equipo NEGRO se verá reducido en 1 jugador en pista durante 2 minutos desde el reinicio del partido después del Tiempo Muerto de Equipo"},"a":["b","e"]},{"id":"2.22","q":"¿Quién está autorizado a participar en un desempate por medio de lanzamientos de 7 metros?","o":{"a":"Todos los jugadores que estén incluidos en el acta del partido","b":"Los jugadores que no hayan sido descalificados","c":"Los jugadores que no estén cumpliendo una exclusión de 2 minutos cuando el tiempo de prórroga haya expirado","d":"Los jugadores que han recibido autorización de los árbitros"},"a":["b","c"]},{"id":"2.23","q":"Un golpe franco directo debe ser ejecutado después de la señal automática de final del partido. NEGRO 9 ocupa la posición correcta y lanza a la portería del equipo BLANCO. Cuando el balón sale de la mano de NEGRO 9, hay un pitido desde la mesa del cronometrador. El balón entra en la portería, sin que el portero BLANCO 1 tenga opción. El cronometrador informa a los árbitros de que BLANCO 7, que estaba dentro del terreno de juego en defensa durante la ejecución del golpe franco, había entrado en el terreno para sustituir a BLANCO 6 justo antes de que el golpe franco fuera ejecutado. ¿Cuál es la decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 7","b":"Descalificación de BLANCO 7 (los árbitros muestran la tarjeta roja)","c":"Gol para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO","e":"Repetición del golpe franco para el equipo NEGRO después del toque de silbato"},"a":["a","e"]},{"id":"2.24","q":"El partido está todavía empatado después de las prórrogas y las normas exigen una decisión por medio de lanzamientos de 7 metros. BLANCO 7 recibió una exclusión de 2 minutos en el minuto 9 de la segunda prórroga. Él es designado por el oficial responsable de equipo para participar en los lanzamientos de 7 metros. ¿Decisión correcta?","o":{"a":"BLANCO 7 está autorizado a participar","b":"BLANCO 7 no está autorizado a participar"},"a":["b"]},{"id":"2.25","q":"¿Cuándo es obligatorio un Tiempo Muerto?","o":{"a":"Cuando un oficial de equipo recibe una exclusión de 2 minutos","b":"Cuando un jugador recibe su tercera exclusión de 2 minutos","c":"Después de una conducta antideportiva repetida","d":"Cuando los árbitros necesitan consultarse entre ellos para tomar una decisión","e":"Después de una conducta antideportiva grave","f":"Después de mostrar una tarjeta amarilla a un oficial de equipo"},"a":["a","b","c","d","e"]},{"id":"2.26","q":"Justo antes del final del primer tiempo, BLANCO 7 agrede a NEGRO 5, quien pierde una clara ocasión de gol. La señal final automática suena antes de que los árbitros tengan tiempo para pitar. ¿Decisión correcta?","o":{"a":"La primera parte ha terminado; ninguna otra acción","b":"Descalificación para BLANCO 7 sin informe escrito (tarjeta roja mostrada por los árbitros)","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Golpe franco para el equipo NEGRO","e":"Descalificación para BLANCO 7, informe escrito (tarjetas roja y azul mostradas por los árbitros)","f":"El equipo BLANCO será reducido en 1 jugador en pista durante 2 minutos desde el inicio de la segunda parte"},"a":["c","e","f"]},{"id":"2.27","q":"Un golpe franco debe ser ejecutado después de la señal de final de primer tiempo. ¿Qué jugadores pueden ser sustituidos?","o":{"a":"Todos los jugadores de ambos equipos","b":"Sólo jugadores del equipo defensor","c":"Sólo jugadores del equipo atacante","d":"Sólo un jugador del equipo atacante","e":"Un jugador del equipo defensor por un portero, si el equipo jugaba en el momento de la señal de final jugaba sin portero"},"a":["d","e"]},{"id":"2.28","q":"¿Qué posiciones deben tener los jugadores durante la ejecución de un golpe franco después de la señal de final de partido?","o":{"a":"Todos los compañeros del lanzador deben estar fuera de la línea de golpe franco del contrario","b":"Todos los compañeros del lanzador deben estar en su propia mitad del terreno","c":"Los contrarios deben estar a 3 metros del lanzador o junto a su propia línea de área de portería","d":"Todos los compañeros del lanzador deben estar al menos a 3 metros de éste","e":"Todos los compañeros del lanzador podrán permanecer junto a éste en la línea de golpe franco de los contrarios"},"a":["a","c","d"]},{"id":"2.29","q":"El atacante BLANCO 7 pasa el balón a BLANCO 8. En ese momento el cronometrador pita para un Tiempo Muerto de Equipo del equipo BLANCO. Los árbitros y jugadores no oyen la señal y BLANCO 8 pasa el balón a BLANCO 10 que tiene una clara ocasión de gol. BLANCO 10 es ilegalmente parado por NEGRO 5. Los árbitros conceden un lanzamiento de 7 metros para el equipo BLANCO y una exclusión de 2 minutos para NEGRO 5. En este momento los árbitros se dan cuenta de que el cronometrador había pitado debido a la solicitud del Tiempo Muerto de Equipo. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo BLANCO","b":"Exclusión de 2 minutos para NEGRO 5","c":"Tiempo Muerto de Equipo para el equipo BLANCO","d":"Saque de portería para el equipo NEGRO","e":"Toque de silbato para reanudar","f":"Reanudación con golpe franco para el equipo BLANCO en la posición donde se encontraba BLANCO 7 en el momento del toque de silbato del cronometrador"},"a":["b","c","e","f"]},{"id":"2.30","q":"La señal automática que indica el final de la primera parte ha sonado 1 minuto antes. En el momento del pitido, ningún equipo estaba en posesión del balón y no hubo ninguna infracción (el balón estaba en el suelo, sobre el área de juego). Ambos equipos están todavía en el terreno de juego. ¿Decisión correcta?","o":{"a":"El minuto no se juega","b":"El minuto se juega antes del descanso","c":"El minuto se juega después del descanso, antes del inicio de la segunda parte","d":"El minuto es añadido a la segunda parte","e":"Se decide a través de un sorteo cuál es el equipo que continua en posesión del balón cuando se juegue el minuto","f":"El último equipo que estaba en posesión del balón es el que continua con la posesión cuando el juego se reanude"},"a":["b","f"]},{"id":"2.31","q":"La primera parte del partido ha finalizado 1 minuto antes. No ha habido ninguna infracción y el balón estaba en el aire sobre el área de portería. El portero coge el balón después de la señal final. Ambos equipos están todavía en el terreno de juego. ¿Decisión correcta?","o":{"a":"El minuto no se juega","b":"El minuto se juega antes del descanso","c":"El minuto se juega después del descanso, antes del inicio de la segunda parte","d":"El minuto es añadido a la segunda parte","e":"El equipo que estaba en posesión del balón es el que continúa con la posesión cuando el juego se reanude","f":"El juego se reanuda por medio de un saque de portería"},"a":["b","e"]},{"id":"2.32","q":"La primera parte del partido ha finalizado 1 minuto antes. No ha habido ninguna infracción y el balón se encuentra en el aire sobre el área de portería. Después de la señal final, el balón se va por la línea exterior de portería. Ambos equipo están todavía en el terreno de juego. ¿Decisión correcta?","o":{"a":"El minuto no se juega","b":"El minuto se juega antes del descanso","c":"El minuto se juega después del descanso, antes del inicio de la segunda parte","d":"El minuto se añade a la segunda parte","e":"El equipo que estaba en posesión del balón es el que continúa con la posesión cuando el juego se reanude","f":"El juego se reanuda por medio con un saque de portería"},"a":["b","e"]},{"id":"2.33","q":"El equipo BLANCO ha marcado un gol y el equipo NEGRO quiere realizar un saque de centro rápido. Por eso NEGRO 5 bota rápidamente el balón en dirección a la línea de centro. Mientras hace esto, BLANCO 3 pasa corriendo y con su mano abierta le quita el balón a NEGRO 5. Por este motivo, el balón golpea en el pie de NEGRO 5 y sale rodando por encima de la línea de centro hasta el terreno de juego de los oponentes. ¿Decisión correcta?","o":{"a":"Tiempo Muerto","b":"Saque de centro para el equipo NEGRO","c":"Sanción progresiva para BLANCO 3","d":"Golpe franco para el equipo BLANCO","e":"Exclusión de 2 minutos para BLANCO 3"},"a":["a","b","e"]},{"id":"2.34","q":"¿En qué situaciones NO es obligatorio un Tiempo Muerto?","o":{"a":"El balón se va lejos del terreno de juego","b":"El cronometrador hace sonar su silbato","c":"Un jugador parece estar lesionado","d":"Cuando los árbitros indican diferentes direcciones al tomar una decisión","e":"Un jugador de campo es sustituido por un portero para ejecutar un saque de portería"},"a":["a","c","e"]},{"id":"2.35","q":"¿Quién puede solicitar un Tiempo Muerto de Equipo?","o":{"a":"Uno de los oficiales de equipo","b":"Un j uipo NEGRO ya ha recibido una amonestación. Tras una decisión de los árbitros, el oficial D del equipo NEGRO entra varios metros dentro del terreno de juego sin permiso de los árbitros. ¿Decisión correcta?","o":{"a":"No hay sanción","b":"Amonestación para el oficial D del equipo NEGRO","c":"Exclusión de 2 minutos para el oficial D del equipo NEGRO","d":"Descalificación para el oficial D del equipo NEGRO (tarjetas roja y azul mostradas por los árbitros)"},"a":["c"]},{"id":"4.30","q":"Hay un Tiempo Muerto por la lesión de BLANCO 6 debido a un incidente que no conllevó una sanción progresiva contra un jugador del equipo NEGRO. Los árbitros dan permiso para que dos personas entren en la pista para atender a BLANCO 6. El oficial C del equipo BLANCO atiende a BLANCO 6. El oficial A del equipo BLANCO persigue a NEGRO 5 que en su opinión ha causado la lesión. Sigue a NEGRO 5 hasta la zona de cambios y lo golpea en la cara ¿Decisión correcta?","o":{"a":"Descalificación del oficial A del equipo BLANCO, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo BLANCO se reduce en un jugador en pista durante 2 minutos","b":"El juego se reanuda, después del toque de silbato, con el lanzamiento que corresponde al motivo de la interrupción","c":"Exclusión de 2 minutos para el oficial A del equipo BLANCO, el equipo BLANCO se reduce en un jugador en pista durante 2 minutos","d":"Golpe franco para el equipo NEGRO","e":"Descalificación del oficial A del equipo BLANCO sin informe escrito (tarjeta roja mostrada por los árbitros), el equipo BLANCO se reduce en un jugador en pista durante 2 minutos","f":"Después de recibir atención médica en la pista, BLANCO 6 debe abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["a","b","f"]},{"id":"4.31","q":"Justo después de la ejecución de un saque de centro del equipo NEGRO, los árbitros detectan que una persona que no está inscrita en el acta de partido está presente en la zona de cambios del equipo NEGRO. Los árbitros comprueban que es uno de los directivos del club, pero el equipo NEGRO ya tenía inscritas a cinco personas como oficiales de equipo en el acta de partido. ¿Decisión correcta?","o":{"a":"La persona que no está inscrita en acta debe abandonar la zona de cambios","b":"El oficial responsable del equipo NEGRO recibe una sanción progresiva","c":"Un oficial adicional de equipo debe abandonar la zona de cambios","d":"El encuentro se reanuda con golpe franco para el equipo BLANCO","e":"El encuentro se reanuda con golpe franco para el equipo NEGRO"},"a":["a","b","d"]},{"id":"4.32","q":"¿Qué está establecido en relación con el uniforme?","o":{"a":"Todos los jugadores de un equipo identificados como porteros deben llevar camisetas del mismo color","b":"Los jugadores deben llevar números de al menos 20 cm. de alto, tanto delante como detrás","c":"Los porteros están autorizados a llevar protecciones para la cabeza si están fabricadas de material blando","d":"Los jugadores, incluidos los porteros, pueden llevar números del 1 al 100"},"a":["a"]},{"id":"4.33","q":"BLANCO 10 está cumpliendo su primera exclusión de 2 minutos en el 21:00. Una vez reanudado el partido, protesta tan enérgicamente que los árbitros interrumpen el juego en 21:30 para sancionar a BLANCO 10 con una exclusión adicional de 2 minutos. ¿Cuáles son las consecuencias para el equipo BLANCO?","o":{"a":"Exclusión de 2 minutos para BLANCO 10","b":"Descalificación para BLANCO 10","c":"El equipo BLANCO será reducido en un jugador hasta el 25:00","d":"El equipo BLANCO será reducido en dos jugadores hasta el 23:00 y luego en un jugador hasta el 23:30"},"a":["a","d"]},{"id":"4.34","q":"¿En cuál de los siguientes casos se debe sancionar al oficial responsable de equipo?","o":{"a":"Cuando un jugador de su equipo abandona la zona de cambios sin informar al anotador/cronometrador","b":"Si hay personas presentes en la zona de cambios, cuando empieza el partido, que no están inscritas en el acta del partido","c":"Cuando un jugador adicional entra en el terreno de juego","d":"Cuando un jugador que no está autorizado a participar entra en el terreno de juego","e":"Si una equipación incorrecta es detectada después del inicio del partido","f":"Si hay infracciones en la zona de cambios que no pueden ser claramente atribuidas de manera individual","g":"Si se detecta que los jugadores en la zona de cambios llevan una equipación incorrecta después del inicio del partido"},"a":["b","d","e","f"]},{"id":"4.35","q":"Los árbitros realizan la gestoforma dando permiso para entrar al campo porque un jugador del equipo BLANCO está lesionado. ¿A quién le está permitido entrar al terreno de juego?","o":{"a":"Dos oficiales del equipo BLANCO; nadie más","b":"Dos oficiales de cada uno de los equipos BLANCO y NEGRO","c":"Dos personas (oficiales o jugadores) del equipo BLANCO","d":"Dos personas (oficiales o jugadores) de cada uno de los equipos BLANCO y NEGRO","e":"El médico del equipo BLANCO, si él no es uno de los cinco oficiales de equipo"},"a":["c"]},{"id":"4.36","q":"El oficial C del equipo BLANCO ya ha recibido una amonestación por protestar. Más tarde, el oficial B del equipo BLANCO penetra en el terreno de juego sin permiso, pero no se comporta de manera antideportiva. ¿Cuál es la decisión correcta?","o":{"a":"Amonestación para el oficial B del equipo BLANCO","b":"Exclusión de 2 minutos para el oficial B del equipo BLANCO; debe abandonar la zona de cambios durante 2 minutos","c":"Descalificación para el oficial B del equipo BLANCO (tarjeta roja mostrada por los árbitros). El equipo BLANCO se reduce en un jugador en el terreno de juego durante 2 minutos","d":"Exclusión de 2 minutos para el oficial B del equipo BLANCO; el equipo BLANCO se reduce en un jugador en el terreno de juego durante 2 minutos, el oficial B puede mantenerse en la zona de cambios"},"a":["d"]},{"id":"4.37","q":"¿Cuál(es) de las siguientes acciones no está(n) permitida(s) cuando hay un Tiempo Muerto debido a una lesión y los árbitros han mostrado la gestoforma para permitir entrar personas del equipo BLANCO al terreno de juego?","o":{"a":"Los jugadores del equipo NEGRO están cerca de la línea de banda para recibir instrucciones de su entrenador","b":"Los jugadores del equipo BLANCO realizan cambios fuera de su línea de cambios","c":"Uno de los oficiales del equipo BLANCO que se encuentra dentro del terreno de juego, se aleja del jugador lesionado y da instrucciones a otros jugadores de su equipo"},"a":["b","c"]},{"id":"4.38","q":"Antes del comienzo del partido, el delegado se da cuenta de que BLANCO 7 lleva protectores de tobillo de material duro que no están cubiertos. ¿Cuál es la decisión correcta?","o":{"a":"BLANCO 7 puede jugar con los protectores de tobillo, pero el delegado debe hacer un informe escrito a la dirección de la competición","b":"BLANCO 7 no puede jugar con protectores de tobillo que tengan partes duras descubiertas. El delegado debe avisar al oficial responsable del equipo de que el jugador debe quitarse los protectores de tobillo o cubrir las partes duras con material blando","c":"BLANCO 7 recibirá una amonestación","d":"El oficial del equipo responsable recibirá una amonestación","e":"Ninguna de las respuestas anteriores es correcta"},"a":["b"]},{"id":"4.39","q":"En el minuto 29:00 de la primera parte, BLANCO 5 recibe una exclusión de 2 minutos. Después del descanso, el árbitro central pita para empezar la segunda parte. 3 segundos después de esto, el cronometrador hace sonar la señal. El equipo BLANCO tiene 7 jugadores en el terreno de juego. ¿Decisión correcta?","o":{"a":"Un jugador del equipo BLANCO debe abandonar el terreno de juego, ninguna sanción adicional","b":"Exclusión de 2 minutos por el jugador adicional del equipo BLANCO","c":"El equipo BLANCO se reducirá en dos jugadores en el terreno de juego durante 57 segundos y en un jugador durante 1 minuto y 3 segundos"},"a":["b","c"]},{"id":"4.40","q":"Tiempo de juego 43:27. Interrupción efectuada por el cronometrador después del gol marcado por BLANCO 15 y del saque de centro. El cronometrador informa a los árbitros que BLANCO 15 no está incluido en el acta del partido. 16 jugadores del equipo BLANCO ya están inscritos. Los árbitros comprueban que el jugador BLANCO 11 no está presente. ¿Decisión correcta?","o":{"a":"El gol es anulado","b":"El gol es válido","c":"BLANCO 11 es borrado del acta y BLANCO 15 es inscrito en ella en conformidad con las regulaciones de la federación responsable","d":"BLANCO 15 no está autorizado a jugar y debe abandonar el terreno de juego","e":"Sanción progresiva para el oficial responsable del equipo BLANCO","f":"Informe escrito conforme a las regulaciones de la federación responsable"},"a":["b","c","e","f"]},{"id":"4.41","q":"El portero BLANCO 12 se tumba en el suelo con una lesión en la rodilla después de parar un lanzamiento del equipo NEGRO. ¿Decisión correcta?","o":{"a":"BLANCO 12 puede continuar el partido después de recibir tratamiento médico en la pista","b":"Dos personas del equipo BLANCO que están inscritas para participar, pueden entrar en la pista para dar asistencia médica en el terreno a BLANCO 12, después de que las gestoformas 15 y 16 han sido mostradas por los árbitros","c":"Solo una persona del equipo BLANCO, que está inscrita para participar, puede entrar en la pista para dar asistencia médica a BLANCO 12 en el terreno, después de que las gestoformas 15 y 16 han sido mostradas por los árbitros","d":"Después de recibir asistencia médica en la pista, BLANCO 12 solo puede volver a entrar en pista después del tercer ataque de su equipo","e":"Independientemente del número de ataques, BLANCO 12 puede volver a entrar en pista cuando el juego se reanude después del final de la primera parte","f":"Si los oficiales de equipo se niegan a proporcionar la asistencia médica a BLANCO 12, el oficial responsable del equipo será sancionado progresivamente"},"a":["b","d","e","f"]},{"id":"4.42","q":"El portero BLANCO 1 para un lanzamiento del equipo NEGRO. Al hacerlo golpea su cabeza contra el poste de la portería. Necesita asistencia médica en la pista. ¿Decisión correcta?","o":{"a":"BLANCO 1 puede continuar el partido después de recibir asistencia médica en la pista, porque la asistencia fue causada por una lesión en la cabeza","b":"Después de recibir asistencia médica en la pista, BLANCO 1 solo puede volver a entrar en pista después del tercer ataque de su equipo"},"a":["b"]},{"id":"4.43","q":"Después de recibir asistencia médica en la pista, BLANCO 7 está sentado en el banquillo en la zona de cambios. Durante el primer ataque del equipo BLANCO, NEGRO 2 intercepta el balón y corre en un contraataque solo con el portero BLANCO 12 entre él y la portería del equipo BLANCO. Antes de que NEGRO 2 pueda realizar un lanzamiento a portería, BLANCO 7 entra en la pista mediante una sustitución con BLANCO 9. ¿Decisión correcta?","o":{"a":"El cronometrador espera hasta que NEGRO 2 haya realizado el lanzamiento a portería antes de interrumpir el juego a causa de un cambio antirreglamentario del equipo BLANCO","b":"El cronometrador interrumpe el juego inmediatamente a causa de un cambio antirreglamentario del equipo BLANCO","c":"Tiempo Muerto","d":"Exclusión de 2 minutos de BLANCO 7","e":"Descalificación sin informe escrito de BLANCO 7 (tarjeta roja mostrada por los árbitros)","f":"7 metros para el equipo NEGRO","g":"Golpe franco para el equipo NEGRO","h":"Independientemente del número de ataques de su equipo, BLANCO 7 puede reingresar a la pista después de cumplir una exclusión de 2 minutos"},"a":["b","c","d","f","h"]},{"id":"4.44","q":"Después de recibir asistencia médica en la pista, NEGRO 11 está sentado en el banquillo quejándose sobre una decisión del árbitro. Por hacerlo, recibe su primera exclusión de 2 minutos del partido. Tras el segundo ataque del equipo NEGRO, NEGRO 11 vuelve a entrar en la pista después de cumplir sus 2 minutos de exclusión. ¿Decisión correcta?","o":{"a":"Tiempo Muerto","b":"Exclusión de 2 minutos para NEGRO 11","c":"El juego continua","d":"Golpe franco para el equipo BLANCO"},"a":["c"]},{"id":"4.45","q":"NEGRO 10 recibe el balón en la línea de golpe franco. Justo después de coger el balón, es derribado por BLANCO 3. Cae tan desafortunadamente, que se hace daño en el codo y necesita asistencia médica en la pista. ¿Decisión correcta?","o":{"a":"Amonestación para BLANCO 3","b":"Exclusión de 2 minutos para BLANCO 3","c":"Dos personas del equipo NEGRO, que están autorizadas a participar, pueden penetrar en el terreno para dar asistencia médica a NEGRO 10 en la pista, después de las gestoformas 15 y 16 mostradas por uno de los árbitros","d":"NEGRO 10 puede continuar el juego después de recibir asistencia médica en la pista","e":"Después de recibir asistencia médica en la pista, NEGRO 10 solo puede volver al terreno de juego después del tercer ataque de su equipo","f":"Tiempo Muerto"},"a":["b","c","d","f"]},{"id":"4.46","q":"NEGRO 10 recibe el balón de NEGRO 9 en un contraataque. Justo después de pasar el balón, NEGRO 9 es derribado por BLANCO 11. Justo después de recibir el balón, NEGRO 10 cae y queda lesionado en el suelo. ¿Decisión correcta?","o":{"a":"Amonestación para BLANCO 11","b":"Exclusión de 2 minutos para BLANCO 11","c":"Dos personas del equipo NEGRO, que tienen derecho a participar, pueden penetrar en el terreno de juego para dar asistencia médica a NEGRO 10 en la pista, después de las gestoformas 15 y 16 mostradas por uno de los árbitros","d":"NEGRO 10 puede continuar el juego después de recibir asistencia médica en la pista","e":"Después de recibir asistencia médica en la pista, NEGRO 10 solo puede volver al terreno de juego después del tercer ataque de su equipo","f":"Tiempo Muerto"},"a":["b","c","e","f"]},{"id":"4.47","q":"Cuando quedan 3 minutos para el final del partido, el marcador es 21-21. NEGRO 2, que es el máximo anotador de su equipo, se tuerce su tobillo. NEGRO 2 se encuentra en el suelo. Uno de los árbitros pregunta a NEGRO 2, si necesita asistencia médica en la pista. Como NEGRO 2 no responde la pregunta, pero todavía está tirado en el suelo, los árbitros interrumpen el juego y muestran las gestoformas 15 y 16 para permitir a dos personas del equipo NEGRO penetrar en la pista para dar asistencia médica a NEGRO 2. En el equipo NEGRO se niegan a enviar personas a la pista, y antes de que los árbitros realicen cualquier otra acción, NEGRO 2 está listo para continuar el partido. ¿Decisión correcta?","o":{"a":"NEGRO 2 puede continuar el juego","b":"NEGRO 2 debe salir de la pista y solo puede entrar después del tercer ataque de su equipo","c":"Sanción progresiva al oficial responsable del equipo NEGRO"},"a":["b","c"]},{"id":"4.48","q":"Con 30 segundos restantes de la primera mitad, BLANCO 5 recibe asistencia médica en la pista. Después de recibir asistencia médica en la pista, abandona el terreno de juego y solo puede volver a ingresar después del tercer ataque de su equipo. Después de un minuto de la segunda mitad durante el segundo ataque del equipo BLANCO, BLANCO 5 penetra en el terreno de juego con una sustitución correcta con BLANCO 4. ¿Decisión correcta?","o":{"a":"Continua el juego","b":"Exclusión de 2 minutos para BLANCO 5 por un cambio antirreglamentario (penetrar en el terreno de juego antes de tiempo después de recibir asistencia médica en la pista)","c":"Tiempo Muerto"},"a":["a"]},{"id":"4.49","q":"Después de un choque, BLANCO 4 y NEGRO 5 están tendidos en el suelo, aparentemente lesionados. Los árbitros inmediatamente interrumpen el juego y muestran las gestoformas 15 y 16 para dar permiso a ambos equipos para que 2 personas ingresen al terreno de juego para dar asistencia médica en la pista. Antes de que cualquier persona pueda entrar en la pista, NEGRO 5 está listo para jugar. BLANCO 4 recibe asistencia médica en la pista. Después de 20 segundos el juego puede continuar. ¿Decisión correcta?","o":{"a":"Después de recibir asistencia médica en la pista, BLANCO 4 tiene que abandonar el terreno de juego y solo puede vuelve a entrar después del tercer ataque de su equipo","b":"Como NEGRO 5 no recibió asistencia médica en la pista, se le permite continuar jugando","c":"NEGRO 5 tiene que abandonar el terreno de juego y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["a","c"]},{"id":"4.50","q":"BLANCO 2 está lesionado y necesita asistencia médica en el terreno de juego. La primera mitad termina después del primer ataque de su equipo. Cuando el árbitro pita para comenzar la segunda mitad, BLANCO 2 está en la pista durante el ataque de su equipo. ¿Decisión correcta?","o":{"a":"El cronometrador interrumpe el juego inmediatamente e informa a los árbitros","b":"Exclusión de 2 minutos para BLANCO 2","c":"Continua el juego","d":"Golpe franco para el equipo NEGRO en la zona de cambios","e":"No hay exclusión para BLANCO 2, que debe abandonar el terreno de juego. El equipo BLANCO continúa en posesión del balón porque es un error del cronometrador/delegado"},"a":["c"]},{"id":"4.51","q":"BLANCO 4 está recibiendo asistencia médica en la pista. Después de recibir la asistencia, BLANCO 4 tiene que salir del terreno de juego y solo puede volver a ingresar después del tercer ataque de su equipo. Después del segundo ataque del equipo BLANCO, el oficial A del equipo BLANCO le pide a BLANCO 4 que entre a la pista para defender. BLANCO 4 entra a la pista a través de un cambio con BLANCO 6 para defender solamente ¿Decisión correcta?","o":{"a":"El juego continua – BLANCO 4 puede jugar en defensa","b":"Amonestación para BLANCO 4, porque ingresó a la pista antes de tiempo","c":"Exclusión de 2 minutos para BLANCO 4 por un cambio antirreglamentario"},"a":["c"]},{"id":"4.52","q":"BLANCO 11 resbala en el suelo y termina justo fuera del terreno de juego en el otro lado de la zona de cambios. Golpea su cabeza contra el tablero publicitario. Los árbitros inmediatamente interrumpen el juego para dar asistencia médica a BLANCO 11. Después de 20 segundos, BLANCO 11 está listo para jugar. ¿Decisión correcta?","o":{"a":"BLANCO 11 puede continuar el juego, porque estaba fuera del terreno de juego, cuando recibió la asistencia médica","b":"BLANCO 11 tiene que abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["b"]},{"id":"4.53","q":"Después de un minuto de juego, hay un forcejeo entre el pivote NEGRO 3 y BLANCO 6. NEGRO 3 termina tirado en el suelo, aparentemente lesionado. Los árbitros deciden advertir verbalmente a BLANCO 6. NEGRO 3 pide asistencia médica en la pista. Después de recibir asistencia médica en el terreno de juego, NEGRO 3 está listo para continuar jugando. ¿Decisión correcta?","o":{"a":"NEGRO 3 puede continuar jugando","b":"NEGRO 3 tiene que abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["b"]},{"id":"4.54","q":"El equipo NEGRO está en un contraataque. NEGRO 2 bota el balón y es empujado por BLANCO 10. NEGRO 12 pierde parcialmente el control del cuerpo pero se las arregla para pasar el balón a NEGRO 4, que marca un gol. Después de marcar el gol, NEGRO 4 se tuerce el tobillo mientras corre en defensa. Los árbitros interrumpen el juego, excluyen 2 minutos a BLANCO 10 y dan permiso para que 2 personas entren al terreno de juego para dar asistencia médica a NEGRO 4. Después de 30 segundos NEGRO 4 está listo para jugar. ¿Decisión correcta?","o":{"a":"NEGRO 4 puede continuar jugando","b":"NEGRO 4 tiene que abandonar el terreno de juego y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["b"]},{"id":"4.55","q":"BLANCO 11 realiza un lanzamiento a portería. El defensor NEGRO 2 desafortunadamente es golpeado en la cara por el balón y necesita asistencia médica en la pista. Después de 20 segundos de asistencia, NEGRO 2 está listo para jugar. ¿Decisión correcta?","o":{"a":"NEGRO 2 puede continuar jugando, porque la lesión fue causada por un balón en la cara","b":"NEGRO 2 tiene que abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["b"]},{"id":"4.56","q":"El pivote NEGRO 2 está tirado en el suelo en el área de portería del equipo BLANCO después de un lanzamiento a portería solicitando asistencia médica aparentemente debido a una lesión en la pierna. El equipo BLANCO acaba de comenzar un contrataque. ¿Decisión correcta?","o":{"a":"Los árbitros inmediatamente interrumpen el juego y muestran las gestoformas 15 y 16 para solicitar asistencia médica en la pista para NEGRO 2","b":"Continua el juego hasta que haya un resultado del contraataque del equipo BLANCO – entonces interrumpen el juego para solicitar asistencia médica para NEGRO 2"},"a":["b"]},{"id":"4.57","q":"BLANCO 2 está calentando sin codera. Después de 5 minutos de juego, el equipo BLANCO está en posesión del balón. BLANCO 2 penetra en el terreno de juego mediante una sustitución correcta. Los árbitros observan que BLANCO 2 ahora usa una codera con componentes duros descubiertos. ¿Decisión correcta?","o":{"a":"Continua el juego, se le permite usar una codera con componentes duros descubiertos","b":"Los árbitros interrumpen el juego, BLANCO 2 tiene que abandonar la pista y solo puede volver a entrar después de quitarse la codera o cubrir los componentes duros descubiertos","c":"Los árbitros interrumpen el juego, BLANCO 2 tiene que abandonar la pista y sólo puede volver a entrar después de quitarse la codera","d":"Sanción progresiva para BLANCO 2","e":"Sanción progresiva para el oficial responsable del equipo BLANCO","f":"Golpe franco para el equipo BLANCO","g":"Golpe franco para el equipo NEGRO"},"a":["c","e","g"]},{"id":"4.58","q":"Mientras que el equipo BLANCO está atacando cerca de la línea de 9 metros. El jugador BLANCO 7 entra en la pista después una sustitución normal con su sudadera amarilla sobre la camiseta blanca normal. ¿Decisión correcta?","o":{"a":"Tiempo Muerto, el jugador necesita quitarse la sudadera amarilla antes de continuar en la pista","b":"Golpe franco para el equipo NEGRO","c":"Exclusión de 2 minutos para BLANCO 7","d":"Golpe franco para el equipo BLANCO"},"a":["a","d"]},{"id":"4.59","q":"El equipo BLANCO está en posesión del balón, cuando el cronometrador interrumpe el partido. El cronometrador le dice a los árbitros que BLANCO 11 ha entrado en la pista, y no hay BLANCO 11 incluido en el acta de partido. Resulta que el oficial A había incluido erróneamente al jugador en el acta de partido como número 13. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"BLANCO 11 no tiene permitido participar en el partido","d":"Se corrige el error y BLANCO 11 tiene derecho a participar","e":"Informe escrito","f":"Sanción progresiva para el oficial A del equipo BLANCO"},"a":["a","d","e"]},{"id":"4.60","q":"El marcador está 29:29 con 10 segundos restantes en el partido. El portero BLANCO 12 ejecuta un saque de portería y pasa el balón a BLANCO 11. BLANCO 11 ve que BLANCO 9 está en una posición libre en la línea del área de portería del equipo NEGRO. Antes de que pueda realizar el pase a BLANCO 9, el cronometrador interrumpe el juego debido a una mal cambio. NEGRO 2 ha entrado en el terreno de juego antes de que NEGRO 4 lo abandonara. ¿Cuál es la decisión correcta?","o":{"a":"Tiempo Muerto","b":"Golpe franco para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Exclusión de 2 minutos para NEGRO 2","e":"Descalificación para NEGRO 2 (tarjeta roja mostrada por los árbitros)"},"a":["a","b","d"]},{"id":"4.61","q":"El marcador está 29:29 con 10 segundos restantes en el partido. El portero BLANCO 12 ejecuta un saque de portería y pasa el balón a BLANCO 11. BLANCO 11 ve que BLANCO 9 está en una posición libre en la línea del área de portería del equipo NEGRO. Pasa el balón a BLANCO 9. Antes de que BLANCO 9 lance a portería, el delegado interrumpe el juego debido a un mal cambio. NEGRO 2 ha entrado al terreno de juego ante a?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Sanción progresiva para BLANCO 1","d":"Ninguna intervención, ya que esta acción está permitida"},"a":["a"]},{"id":"6.1","q":"El balón está parado en la línea del área de portería. El atacante BLANCO 7 lo recoge e intenta marcar. BLANCO 7 tiene una clara ocasión de gol, cuando le defienden ilegalmente. ¿Decisión correcta?","o":{"a":"Golpe franco a favor del equipo NEGRO","b":"Golpe franco a favor del equipo BLANCO","c":"Lanzamiento de 7 metros a favor del equipo BLANCO","d":"Saque de portería a favor del equipo NEGRO"},"a":["d"]},{"id":"6.2","q":"El balón está rodando en el área de portería del equipo BLANCO. NEGRO 8 recoge el balón y marca un gol. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Saque de portería para el equipo BLANCO","c":"Gol","d":"Saque de centro"},"a":["b"]},{"id":"6.3","q":"BLANCO 3 está con ambos pies en el área de juego y recoge un balón rechazado por su portero. Ante la defensa correcta de NEGRO 10, BLANCO 3 bota el balón varias veces en su propia área de portería. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO","d":"Golpe franco para el equipo BLANCO"},"a":["a"]},{"id":"6.4","q":"BLANCO 7 está fuera del área de portería del equipo NEGRO pero recoge el balón que está claramente en el aire encima del área de portería y marca un gol. ¿Decisión correcta?","o":{"a":"Gol para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Saque de portería para el equipo NEGRO","d":"Saque de portería para el equipo NEGRO después del toque de silbato"},"a":["a"]},{"id":"6.5","q":"El jugador BLANCO 8, que es correctamente defendido por varios contrarios, rueda intencionadamente el balón hacia su propia área de portería, donde el balón se detiene. El portero del equipo BLANCO no recoge el balón. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Saque de portería para el equipo BLANCO, después de un toque de silbato","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Golpe franco para el equipo NEGRO"},"a":["d"]},{"id":"6.6","q":"BLANCO 5 juega intencionadamente el balón hacia su propia área de portería. El balón da en el poste y rueda hacia el área de juego. El portero BLANCO 12 recoge el balón dentro de su área y lo pasa a BLANCO 7 que marca un gol. ¿Cuál es la decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo NEGRO","b":"Gol","c":"Golpe franco para el equipo NEGRO","d":"Saque de portería para el equipo BLANCO"},"a":["c"]},{"id":"6.7","q":"El equipo NEGRO ha marcado un gol y BLANCO 10 ejecuta el saque de centro correspondiente. No encuentra a ningún compañero desmarcado, así que sorprende a su portero BLANCO 12 jugando el balón hacia él, a pesar de que el portero está dentro de su área de portería. BLANCO 12 recepciona el balón y se lo pasa a BLANCO 9. ¿Cuál es la decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO","d":"Repetición del saque de centro después de corregir la situación"},"a":["c"]},{"id":"6.8","q":"El defensor NEGRO 7 se da cuenta de que si el pívot BLANCO 9 recibiera el balón se encontraría solo ante el portero. NEGRO 7, habiendo realizado esta acción anteriormente, rodea a BLANCO 9 pasando a través del área de forma que él no puede recibir el pase. NEGRO 7 está ya fuera del área de portería cuando BLANCO 9 recibe el balón. BLANCO 9 gira y choca directamente con NEGRO 7. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo BLANCO","b":"Golpe franco para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Sanción progresiva para NEGRO 7"},"a":["a","d"]},{"id":"6.9","q":"El balón sale del rechace del portero del equipo NEGRO hacia el jugador atacante BLANCO 4, que lo está esperando justo fuera de la línea del área de portería. Para evitar una clara ocasión de gol, NEGRO 2 penetra en el área de portería y evita que BLANCO 4 coja el balón. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Sanción progresiva para NEGRO 2","d":"Descalificación para NEGRO 2 (tarjeta roja mostrada por los árbitros)"},"a":["b"]},{"id":"6.10","q":"BLANCO 10 pasa el balón hacia su propia área de portería. El portero BLANCO 1 salta y coge el balón en el aire. BLANCO 1 lo sujeta firmemente pero cae fuera del área de portería. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Saque de portería para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["c"]},{"id":"6.11","q":"BLANCO 11 pasa el balón hacia su propia área de portería, donde el portero BLANCO 1 salta y coge el balón en el aire. BLANCO 1 sujeta el balón firmemente y cae con un pie dentro del área de portería y el otro fuera. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Saque de portería para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["c"]},{"id":"6.12","q":"BLANCO 7 del equipo atacante tiene el balón y pisa dentro del área de portería del equipo contrario. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Saque de portería para el equipo NEGRO","c":"Saque de portería para el equipo NEGRO después del toque de silbato","d":"Golpe franco para el equipo NEGRO después del toque de silbato"},"a":["b"]},{"id":"6.13","q":"El balón está parado en el suelo del área de portería del equipo BLANCO. En este momento, el anotador pita y explica que BLANCO 5 ha hecho un cambio antirreglamentario. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Exclusión de 2 minutos para BLANCO 5","c":"Golpe franco para el equipo NEGRO junto a la línea de golpe franco del equipo BLANCO","d":"Golpe franco para el equipo NEGRO junto a la zona de cambios del equipo BLANCO"},"a":["a","b"]},{"id":"6.14","q":"¿En cuál(es) de los siguientes casos debe ordenarse un saque de portería?","o":{"a":"Cuando un jugador del equipo atacante (con balón) toca el área de portería del equipo contrario","b":"Cuando un jugador del equipo atacante (sin balón) toca el área de portería del equipo contrario y gana una ventaja al hacerlo","c":"Cuando un jugador del equipo atacante envía el balón por encima de la línea exterior de portería del equipo contrario","d":"Cuando un jugador con balón toca el área de portería de su propio equipo"},"a":["a","b","c"]},{"id":"6.15","q":"El equipo BLANCO está atacando. NEGRO 4 está parado junto a la línea del área de portería. El balón está en el aire y NEGRO 4 lo alcanza y lo dirige hacia su propia área de portería. El balón es tocado por el portero NEGRO 1 y entonces cruza la línea exterior de portería fuera de la portería. ¿Decisión correcta?","o":{"a":"Saque de banda para el equipo BLANCO","b":"Golpe franco para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Saque de portería para el equipo NEGRO","e":"Sanción progresiva para NEGRO 4"},"a":["b"]},{"id":"6.16","q":"El portero BLANCO 12 ha detenido un lanzamiento y tiene el balón bajo control en su área de portería. El portero aún tiene el balón en sus manos cuando el cronometrador pita por un cambio antirreglamentario del BLANCO 10. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO en la zona de cambios del equipo BLANCO","b":"Tiempo Muerto","c":"Saque de portería para el equipo BLANCO","d":"Exclusión de 2 minutos para BLANCO 10","e":"Golpe franco para el equipo NEGRO en la línea de golpe franco del equipo BLANCO"},"a":["b","c","d"]},{"id":"6.17","q":"El portero BLANCO 12 salta en el área de juego justo fuera de su área de portería, recoge en el aire el balón que le pasó BLANCO 4 y lo lanz
