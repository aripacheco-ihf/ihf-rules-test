rectas, el árbitro pita. Antes de que el balón haya salido de la mano del lanzador, dos de sus compañeros cruzan la línea de golpe franco del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Repetición del golpe franco para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Con toque de silbato","d":"Sin toque de silbato"},"a":["b","d"]},{"id":"15.4","q":"El portero BLANCO 12 está en el área de portería con el balón en su mano, preparado para ejecutar un saque de portería. NEGRO 6 le quita el balón con la mano abierta. ¿Cuál es la decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Golpe franco para el equipo BLANCO","c":"Saque de portería después del toque de silbato","d":"Exclusión de 2 minutos para NEGRO 6"},"a":["b","d"]},{"id":"15.5","q":"Se concede un saque de banda a favor del equipo BLANCO. BLANCO 8 ejecuta el saque de banda como un lanzamiento directo a portería. El balón golpea el poste, vuelve a BLANCO 8, quien coge el balón y lanza a portería consiguiendo un gol. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo NEGRO","b":"Gol para el equipo BLANCO","c":"Se repite el saque de banda después de toque de silbato","d":"Golpe franco para el equipo NEGRO"},"a":["b"]},{"id":"15.6","q":"El portero NEGRO 12 ha parado un lanzamiento a portería. Quiere iniciar un contraataque inmediatamente pero el balón se le cae de tal forma que sobrepasa la línea de gol del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Gol","b":"Repetir el saque de portería después del toque de silbato","c":"Saque de banda para el equipo BLANCO","d":"Golpe franco para el equipo BLANCO"},"a":["b"]},{"id":"15.7","q":"BLANCO 6 ejecuta un saque de banda en dirección a su portero. El portero BLANCO 1 se da cuenta demasiado tarde y el balón entra en la portería. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Gol para el equipo NEGRO","c":"Saque de portería para el equipo BLANCO","d":"Repetir el saque de banda para el equipo BLANCO después del toque de silbato"},"a":["b"]},{"id":"15.8","q":"Saque de banda para el equipo BLANCO. BLANCO 7 lanza el balón de forma que golpea al árbitro. BLANCO 7 recoge el balón de nuevo y lo lanza dentro de la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo NEGRO","b":"Gol para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Repetir el saque de banda después del toque de silbato","e":"Golpe franco para el equipo BLANCO"},"a":["c"]},{"id":"15.9","q":"Golpe franco para el equipo BLANCO. Cuando todos los jugadores están situados correctamente, BLANCO 10 pone el balón en el suelo para dar algunas instrucciones. NEGRO 7 se da cuenta de la situación, recoge el balón e inicia un contraataque. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Repetir el golpe franco para el equipo BLANCO después del toque de silbato","c":"Golpe franco para el equipo BLANCO, amonestación para NEGRO 7","d":"Golpe franco para el equipo BLANCO, exclusión de 2 minutos para NEGRO 7"},"a":["a"]},{"id":"15.10","q":"NEGRO 9 quiere ejecutar un golpe franco, sin embargo BLANCO 11 está solamente a 2 metros del balón intentando retrasar la ejecución. ¿Decisión correcta?","o":{"a":"Sanción progresiva para BLANCO 11, golpe franco para el equipo NEGRO después del toque de silbato","b":"Golpe franco para el equipo BLANCO después del toque de silbato","c":"Exclusión de 2 minutos para BLANCO 11","d":"Corregir la posición de BLANCO 11 y golpe franco después del toque de silbato"},"a":["a"]},{"id":"15.11","q":"Golpe franco para el equipo NEGRO junto a la línea de golpe franco del equipo BLANCO. El árbitro no advierte que el jugador NEGRO 8 está situado entre la línea de golpe franco y la línea del área de portería. NEGRO 8 recibe el balón y marca. ¿Decisión correcta?","o":{"a":"Repetir el golpe franco para el equipo NEGRO después del toque de silbato","b":"Golpe franco para el equipo BLANCO","c":"Gol para el equipo NEGRO","d":"Amonestación para NEGRO 8"},"a":["a"]},{"id":"15.12","q":"El portero NEGRO 12 ejecuta un saque de portería en dirección a la portería del equipo BLANCO. Ningún jugador de ambos equipos toca el balón y éste entra en la portería del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Saque de banda para el equipo BLANCO","c":"Gol para el equipo NEGRO","d":"Amonestación para NEGRO 12 por conducta antideportiva"},"a":["c"]},{"id":"15.13","q":"BLANCO 5 ya ha recibido una amonestación y dos exclusiones de 2 minutos. Cuando el equipo NEGRO está ejecutando un golpe franco, el jugador BLANCO 5 no respeta la distancia, siendo la primera vez que lo hace. ¿Decisión correcta?","o":{"a":"Amonestación para BLANCO 5","b":"Ninguna sanción","c":"Tercera exclusión de 2 minutos para BLANCO y descalificación (tarjeta roja mostrada por los árbitros)"},"a":["c"]},{"id":"15.14","q":"Poco antes de finalizar el encuentro el resultado es de 24-23 a favor del equipo BLANCO. Se concede un golpe franco para el equipo BLANCO aproximadamente 1 metro fuera de la línea de golpe franco del equipo NEGRO. Todos los jugadores están en posición correcta y el árbitro pita para la ejecución del saque. Para ejecutar el golpe franco, BLANCO 10 da un paso antes de que el balón haya abandonado su mano. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Tiempo Muerto","c":"Exclusión de 2 minutos para BLANCO 10","d":"Golpe franco para el equipo NEGRO"},"a":["d"]},{"id":"15.15","q":"BLANCO 14 quiere ejecutar un golpe franco sin toque de silbato en la línea de golpe franco del equipo NEGRO. Él y sus compañeros están en posición correcta. Antes que el balón salga de la mano de BLANCO 14, BLANCO 13 y BLANCO 15 cruzan la línea de golpe franco hacia la línea de portería. ¿Decisión correcta?","o":{"a":"Corrección","b":"Golpe franco para el equipo BLANCO después del toque de silbato","c":"El juego continúa sin interrupción","d":"Golpe franco para el equipo NEGRO"},"a":["a","b"]},{"id":"15.16","q":"El portero NEGRO 1 está ejecutando un saque de portería. El balón golpea en el árbitro y vuelve a NEGRO 1 quien, al mismo tiempo, ha salido del área de portería. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Repetición del saque de portería después de toque de silbato","c":"Golpe franco para el equipo BLANCO","d":"Golpe franco para el equipo NEGRO después de toque de silbato"},"a":["c"]},{"id":"15.17","q":"Al ejecutar un golpe franco, NEGRO 11 balancea su brazo mientras mueve el balón completamente fuera de la línea de banda. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco el equipo BLANCO","c":"Saque de banda para el equipo BLANCO","d":"Golpe franco para el equipo BLANCO, NEGRO 11 es advertido verbalmente"},"a":["a"]},{"id":"15.18","q":"El portero BLANCO 1 para el balón justo frente a la línea de gol. Cuando intenta pasar el balón a BLANCO 4, el balón se cae de sus manos y entra en su propia portería. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Repetición del saque de portería para el equipo BLANCO después de toque de silbato"},"a":["d"]},{"id":"15.19","q":"El equipo BLANCO saca de centro. El árbitro central toca el silbato para la ejecución. Entonces BLANCO 13 coge el balón de la mano de BLANCO 9 que estaba parado, listo para ejecutar el saque porque BLANCO 13 ve que BLANCO 7 y BLANCO 3 estaban corriendo hacia el campo de los contrarios y se encontraban en una posición favorable. BLANCO 13 pasa el balón a BLANCO 7 que marca un gol. ¿Decisión correcta?","o":{"a":"Gol para el equipo BLANCO","b":"Corrección; repetición del saque de centro para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Advertencia verbal para BLANCO 13","e":"Advertencia verbal para BLANCO 7 y BLANCO 13"},"a":["c"]},{"id":"15.20","q":"(Sin área de saque de centro). El resultado es 30-30 justo 4 segundos antes del final. El equipo BLANCO consigue un gol, 31-30. El equipo NEGRO quiere realizar un saque de centro rápido. NEGRO 10 está con un pie detrás de la línea central y otro delante de ella. Sin toque de silbato, lanza el balón y éste entra en la portería del equipo BLANCO. Entonces suena la señal de final de partido. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Repetición del saque de centro para el equipo NEGRO","c":"Esperar al resultado del lanzamiento","d":"Tiempo Muerto","e":"El partido ha finalizado; el gol no es válido"},"a":["e"]},{"id":"15.21","q":"Golpe franco para el equipo BLANCO junto a la línea de golpe franco del equipo NEGRO. BLANCO 7 que ejecuta el golpe franco. Al igual que sus compañeros de equipo, está correctamente situado fuera de la línea de golpe franco. El golpe franco es rápidamente ejecutado sin toque de silbato, pero antes que el balón haya salido de la mano de BLANCO 7, ambos jugadores, BLANCO 9 y BLANCO 18, cruzan la línea de golpe franco. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Corrección","c":"Golpe franco para el equipo BLANCO después del toque de silbato","d":"Golpe franco para el equipo NEGRO; amonestación para BLANCO 9 y BLANCO 18"},"a":["b","c"]},{"id":"15.22","q":"¿En cuáles de los siguientes lanzamientos no es posible conseguir un gol en propia portería?","o":{"a":"Saque de portería","b":"Golpe franco","c":"Saque de banda","d":"Saque de centro"},"a":["a"]},{"id":"15.23","q":"NEGRO 4 está en la posición correcta para ejecutar un saque de banda concedido a su equipo. Como no encuentra un compañero a quien pasar el balón, él bota el balón una vez por dentro de la línea de banda. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO sin toque de silbato","b":"Saque de banda para el equipo BLANCO después de toque de silbato","c":"Repetición del saque de banda para el equipo NEGRO después de toque de silbato","d":"Golpe franco para el equipo NEGRO después de toque de silbato"},"a":["a"]},{"id":"15.24","q":"El equipo BLANCO recibe un golpe franco. BLANCO 9 ejecuta rápidamente el golpe franco saltando, sin señal de reanudación por parte del árbitro. El balón va hacia BLANCO 4, que se encuentra completamente solo frente a la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Continúa el juego sin interrupción","b":"Golpe franco para el equipo NEGRO","c":"Repetición del golpe franco a favor del equipo BLANCO después de toque de silbato"},"a":["c"]},{"id":"15.25","q":"El equipo BLANCO recibe un golpe franco. BLANCO 5 ejecuta rápidamente el golpe franco mientras corre, sin señal de reanudación por parte del árbitro. BLANCO 5 intenta jugar el balón hacia BLANCO 4, pero NEGRO 3 lo intercepta y se queda totalmente solo frente a la portería del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Continúa el juego sin interrupción","b":"Repetición del golpe franco después de la señal de reanudación","c":"Repetición del golpe franco y sanción progresiva contra NEGRO 3"},"a":["a"]},{"id":"15.26","q":"El equipo NEGRO está preparado para ejecutar un golpe franco sin señal de silbato. NEGRO 8 ejecuta el lanzamiento con ambos pies y su mano izquierda en contacto con el suelo. NEGRO 6 recibe el balón y marca un gol. ¿Cuál es la decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Corrección, repetición del golpe franco después de la señal de silbato de los árbitros","c":"Golpe franco para el equipo BLANCO"},"a":["b"]},{"id":"15.27","q":"El equipo NEGRO marca un gol. Los árbitros pitan para el saque de centro posterior. Antes de que el balón haya salido de la mano del lanzador, el cronometrador hace sonar el silbato. BLANCO 5 ha entrado en la pista antes de que BLANCO 6 haya salido. ¿Cuál es la decisión correcta?","o":{"a":"Tiempo Muerto","b":"Exclusión de 2 minutos para BLANCO 5","c":"Exclusión de 2 minutos para BLANCO 6","d":"Dado que el balón no estaba en juego en el momento de la interrupción, el partido se reanuda con un saque de centro para el equipo BLANCO","e":"El partido se reanuda con un golpe franco para el equipo NEGRO","f":"El partido se reanuda con un golpe franco para el equipo BLANCO"},"a":["a","b","e"]},{"id":"16.1","q":"El oficial B del equipo BLANCO está protestando y recibe una exclusión de 2 minutos. Antes de reanudarse el juego protesta de nuevo y por tanto es descalificado. ¿Decisión correcta?","o":{"a":"El equipo BLANCO se reduce en 2 jugadores durante 2 minutos","b":"El equipo BLANCO se reduce en 1 jugador durante 4 minutos","c":"El equipo BLANCO se reduce en 1 jugador durante 2 minutos"},"a":["c"]},{"id":"16.2","q":"BLANCO 8 recibe una exclusión de 2 minutos por empujar a un contrario. Se acerca al árbitro y lo insulta con las siguientes palabras: “¡Estúpido, idiota, nunca vas a aprender!”. Antes de abandonar el terreno de juego, escupe en la cara del árbitro. ¿Decisión correcta?","o":{"a":"Descalificación para BLANCO 8, el equipo BLANCO se reduce en 1 jugador durante 4 minutos (tarjeta roja mostrada por los árbitros)","b":"Descalificación para BLANCO 8, el equipo A se reduce en 2 jugadores durante 2 minutos (tarjeta roja mostrada por los árbitros)","c":"Descalificación para BLANCO 8, el equipo BLANCO se reduce en 1 jugador durante 4 minutos, informe escrito (tarjetas roja y azul mostradas por los árbitros)","d":"Descalificación para BLANCO 8, el equipo BLANCO se reduce en 2 jugadores durante 2 minutos, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["c"]},{"id":"16.3","q":"¿Cuántas amonestaciones deberían mostrarse como máximo a los oficiales de un equipo durante un partido?","o":{"a":"Ninguna","b":"1","c":"2","d":"3"},"a":["b"]},{"id":"16.4","q":"¿Cuándo comienza el tiempo de exclusión de un jugador?","o":{"a":"Cuando el árbitro realiza la gestoforma de exclusión","b":"Cuando el jugador excluido cruza la línea de banda","c":"Cuando el árbitro hace sonar su silbato para que se reanude el partido","d":"Cuando el cronometrador pone en marcha el cronómetro"},"a":["c"]},{"id":"16.5","q":"¿A quién se debe indicar las exclusiones?","o":{"a":"Al jugador excluido y al anotador/cronometrador","b":"Al oficial responsable de equipo y al cronometrador","c":"Al anotador/cronometrador","d":"Al jugador excluido, al oficial responsable de equipo y al anotador"},"a":["a"]},{"id":"16.6","q":"NEGRO 5 ha recibido ya dos exclusiones de 2 minutos, una por una falta que fue sancionada progresivamente y otra por lanzar el balón lejos cuando el árbitro ha señalado un golpe franco a favor de los contrarios. Ahora él realiza el segundo cambio antirreglamentario de su equipo, y antes de que el juego se reanude, comete una conducta extremadamente antideportiva. ¿Qué sanción es correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 5","b":"Descalificación de NEGRO 5, informe escrito (tarjetas roja y azul mostradas por los árbitros); el equipo NEGRO se reduce con 1 jugador en pista durante 4 minutos","c":"Descalificación de NEGRO 5, informe escrito (tarjetas roja y azul mostradas por los árbitros); el equipo NEGRO se reduce con 1 jugador en pista durante 2 minutos"},"a":["a","b"]},{"id":"16.7","q":"BLANCO 5 recibe una exclusión de 2 minutos por cometer una falta. Mientras sale del terreno de juego, insulta al árbitro y es descalificado. BLANCO 5 se enfada tanto que golpea a uno de los árbitros. ¿Decisión correcta?","o":{"a":"Informe escrito (tarjetas roja y azul mostradas por los árbitros)","b":"El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos","c":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","d":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos"},"a":["a","d"]},{"id":"16.8","q":"BLANCO 7 acaba de ser excluido por una actitud antideportiva. Inmediatamente dice al árbitro: “¡Tú debes estar ciego, idiota!”. ¿Decisión correcta?","o":{"a":"Otra exclusión de 2 minutos para BLANCO 7","b":"Descalificación sin informe escrito para BLANCO 7 (tarjeta roja mostrada por los árbitros)","c":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","d":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos","e":"Descalificación de BLANCO 7, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["d","e"]},{"id":"16.9","q":"BLANCO 3 ha sido excluido 2 minutos. Después de abandonar el terreno de juego, pero antes de reanudarse el partido, BLANCO 3 comete una conducta antideportiva grave en la zona de cambios contra el oficial B del equipo NEGRO. El oficial B del equipo NEGRO, justo antes de eso, entraba corriendo dentro del terreno de juego aunque no se había dado permiso. Aun no se había sancionado a los oficiales del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Descalificación sin informe escrito para BLANCO 3 (tarjeta roja mostrada por los árbitros)","b":"Amonestación para el oficial B de equipo NEGRO","c":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","d":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos"},"a":["a","b","d"]},{"id":"16.10","q":"Cuando un jugador es descalificado, el equipo se reduce en 1 jugador en pista durante 2 minutos, excepto si la descalificación es:","o":{"a":"Por conducta antideportiva grave durante el descanso","b":"Por una infracción cometida fuera del terreno de juego","c":"Antes del comienzo del partido","d":"Por insultar a los árbitros"},"a":["c"]},{"id":"16.11","q":"Durante el descanso, el jugador BLANCO 7 agrede al portero NEGRO 12 cuando éste está en el terreno de juego. ¿Decisión correcta?","o":{"a":"Descalificación a BLANCO 7, informe escrito (tarjetas roja y azul mostradas por los árbitros). El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos a partir del inicio de la segunda parte","b":"Amonestación para BLANCO 7","c":"Advertencia verbal para BLANCO 7, porque el partido estaba interrumpido"},"a":["a"]},{"id":"16.12","q":"Durante el descanso un árbitro es insultado por BLANCO 7 de camino a los vestuarios. ¿Cuál es la decisión correcta?","o":{"a":"Descalificación sin informe escrito de BLANCO 7 (tarjeta roja mostrada por los árbitros)","b":"Exclusión de 2 minutos para BLANCO 7","c":"El equipo NEGRO se reduce en 1 jugador en pista durante 2 minutos al inicio del segundo tiempo","d":"Descalificación de BLANCO 7, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["c","d"]},{"id":"16.13","q":"Tras el toque de silbato de final del primer tiempo, NEGRO 5 choca con BLANCO 9 y se gritan uno a otro. Entonces BLANCO 9 empuja en el pecho a NEGRO 5 con ambas manos de forma que NEGRO 5 casi pierde el control de su cuerpo ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 9, al inicio del segundo tiempo","b":"Descalificación sin informe escrito para el jugador BLANCO 9 (tarjeta roja mostrada por los árbitros), el equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos desde el inicio del segundo tiempo","c":"Descalificación para BLANCO 9, el equipo BLANCO comienza el segundo tiempo sin reducción de jugadores","d":"Descalificación para el jugador BLANCO 9, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos desde el inicio del segundo tiempo"},"a":["b"]},{"id":"16.14","q":"Después del partido BLANCO 10 grita al árbitro: “¡Nos robaste el partido, idiota!” ¿Decisión correcta?","o":{"a":"Amonestación para BLANCO 10","b":"Descalificación de BLANCO 10, informe escrito (tarjetas roja y azul mostradas por los árbitros)","c":"Informe escrito","d":"Amonestación para BLANCO 10, informe escrito"},"a":["c"]},{"id":"16.15","q":"En la pista durante el descanso de un partido, BLANCO 9 agrede al oficial B del equipo NEGRO, quien posteriormente insulta al jugador BLANCO 9. ¿Decisión correcta?","o":{"a":"Descalificación de BLANCO 9, informe escrito (tarjetas roja y azul mostradas por los árbitros); el equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos desde el inicio de la segunda parte","b":"Descalificación del oficial B del equipo NEGRO, informe escrito (tarjetas roja y azul mostradas por los árbitros); el equipo NEGRO se reduce en 1 jugador en pista durante 2 minutos desde el inicio de la segunda parte","c":"Descalificación de BLANCO 9 (tarjeta roja mostrada por los árbitros); el equipo BLANCO no se reduce al inicio de la segunda parte","d":"Descalificación del oficial B del equipo NEGRO (tarjeta roja mostrada por los árbitros); el equipo NEGRO no se reduce al inicio de la segunda parte"},"a":["a","b"]},{"id":"16.16","q":"BLANCO 7 es descalificado porque acaba de recibir su tercera exclusión de 2 minutos. Él trata de discutir con los árbitros y no abandona el terreno de juego. ¿Decisión correcta?","o":{"a":"Ninguna otra acción","b":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos","c":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos"},"a":["b"]},{"id":"16.17","q":"BLANCO 11 fue amonestado durante el tiempo de juego y es nuevamente responsable de una conducta antideportiva durante el descanso. El equipo BLANCO está jugando sin reducción de jugadores en pista cuando finaliza la primera parte. ¿Decisión correcta?","o":{"a":"Amonestación para BLANCO 11","b":"Exclusión de 2 minutos para BLANCO 11","c":"Descalificación para BLANCO 11","d":"El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos desde el inicio de la segunda parte","e":"El equipo BLANCO no se reduce en su número de jugadores en pista al inicio de la segunda parte"},"a":["b","d"]},{"id":"16.18","q":"BLANCO 4 se ha lesionado. Los árbitros conceden un Tiempo Muerto y realizan la señal para permitir al equipo BLANCO entrar y atender al jugador. Dos oficiales del equipo BLANCO, pero también el oficial A del equipo NEGRO, entran en el terreno de juego. El oficial A del equipo NEGRO ya había recibido una amonestación. ¿Decisión correcta?","o":{"a":"Ninguna intervención","b":"El equipo NEGRO continúa el partido sin ninguna reducción de jugadores en el terreno de juego cuando el partido se reinicia","c":"Exclusión de 2 minutos para el oficial A del equipo NEGRO","d":"Descalificación para el oficial A del equipo NEGRO (tarjeta roja mostrada por los árbitros)","e":"El equipo NEGRO se reduce en 1 jugador en pista durante 2 minutos cuando el partido se reanude","f":"Después de recibir atención médica en la pista, BLANCO 4 debe abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["c","e","f"]},{"id":"16.19","q":"NEGRO 9 es descalificado debido a una falta grave contra BLANCO 9. Antes de que el juego se reanude, NEGRO 9 golpea en la cara al oficial A del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Descalificación sin informe escrito de NEGRO 9 (tarjeta roja mostrada por los árbitros), el equipo NEGRO se reduce en 2 jugadores en pista durante 2 minutos","b":"Descalificación sin informe escrito de NEGRO 9 (tarjeta roja mostrada por los árbitros), el equipo NEGRO se reduce en 1 jugador en pista durante 4 minutos","c":"No es posible ninguna sanción adicional","d":"Descalificación de NEGRO 9, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo NEGRO se reduce en 2 jugadores en pista durante 2 minutos","e":"Descalificación de NEGRO 9, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo NEGRO se reduce en 1 jugador en pista durante 4 minutos"},"a":["e"]},{"id":"16.20","q":"NEGRO 8 ha recibido su primera exclusión de 2 minutos después de un Tiempo Muerto. Cuando abandona la pista antes de que el juego se reanude se dirige a los árbitros de manera incorrecta. ¿Decisión correcta?","o":{"a":"Una exclusión adicional de 2 minutos para NEGRO 8, el equipo NEGRO se reduce en 2 jugadores en pista durante 2 minutos","b":"Una exclusión adicional de 2 minutos para NEGRO 8, el equipo NEGRO se reduce en 1 jugador en pista durante 4 minutos","c":"Descalificación para NEGRO 8 (tarjeta roja mostrada por los árbitros), el equipo NEGRO se reduce en 2 jugadores en pista durante 2 minutos","d":"Descalificación para NEGRO 8 (tarjeta roja mostrada por los árbitros), el equipo NEGRO se reduce en 1 jugador en pista durante 4 minutos"},"a":["b"]},{"id":"16.21","q":"¿En cuáles de las siguientes situaciones debe un equipo reducirse en 1 jugador en el terreno de juego durante 4 minutos?","o":{"a":"Un jugador ha sido descalificado. Mientras está abandonando el terreno de juego, él protesta de tal forma que justifica una exclusión de 2 minutos","b":"Un jugador ha recibido una exclusión de 2’. Mientras está abandonando el terreno de juego, él insulta a los árbitros y es descalificado","c":"Un jugador ha recibido una exclusión de 2 minutos por conducta antideportiva contra un oponente. Mientras aún está en el terreno de juego, él golpea a un contrario en la cara y es descalificado","d":"Un jugador ha recibido una exclusión de 2 minutos por conducta antideportiva; después de cruzar la línea de banda, él vuelve atrás al terreno de juego y protesta; los árbitros le sancionan con una exclusión adicional de 2 minutos","e":"Un jugador ha sido descalificado por escupir a un oponente. Cuando está abandonando el terreno de juego, empuja a un árbitro","f":"Un jugador ha sido descalificado por una infracción grave; después de abandonar el terreno de juego, y después de que el partido se haya reanudado, él insulta a los árbitros mientras está sentado en la zona de los espectadores"},"a":["a","b","c","d","e"]},{"id":"16.22","q":"BLANCO 5 recibe una exclusión de 2 minutos en el minuto 7. Él mismo protesta antes de que se reanude el juego y recibe una exclusión adicional de 2 minutos. Justo un minuto después, entra al terreno de juego y el cronometrador pita. Debido a la exclusión adicional por entrar al terreno de juego, es descalificado. A causa de esto, insulta a los árbitros. ¿Decisión Correcta?","o":{"a":"El equipo BLANCO se reduce en 1 jugador en pista desde el 7:00 al 8:00; en 2 jugadores desde el 8:00 al 10:00 y en 1 jugador desde el 10:00 al 11:00","b":"El equipo BLANCO se reduce en 1 jugador en pista desde el 7:00 al 8:00; en 2 jugadores del 8:00 al 11:00 y en 1 jugador del 11:00 al 12:00","c":"El equipo BLANCO se reduce en 2 jugadores en pista desde el 7:00 al 8:00; en 3 jugadores desde el 8:00 al 10:00 y en 2 jugadores desde el 10:00 al 11:00","d":"El equipo BLANCO se reduce en 2 jugadores en pista desde el 7:00 al 8:00; en 4 jugadores desde el 8:00 al 10:00 y en 2 jugadores desde el 10:00 al 11:00","e":"Descalificación de BLANCO 5. informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["b","e"]},{"id":"16.23","q":"El oficial C del equipo BLANCO recibe una amonestación en la primera mitad debido a una conducta antideportiva. El tiempo de juego es de 35:50, y el oficial B del equipo BLANCO, con gestos enérgicos, muestra que no está de acuerdo con la decisión de los árbitros. Para ello, recibe una exclusión de 2 minutos. Tres minutos antes del final del partido, el oficial A del equipo BLANCO ingresa en el terreno de juego sin el permiso de los árbitros. ¿Cuál es la decisión correcta?","o":{"a":"Amonestación para el oficial A del equipo BLANCO","b":"Exclusión de 2 minutos para el oficial A del equipo BLANCO; el equipo BLANCO se reduce en el terreno de juego por 1 jugador durante 2 minutos. El oficial A puede quedarse en la zona de cambios","c":"Exclusión de 2 minutos para el oficial A del equipo BLANCO; el equipo BLANCO se reduce en el terreno de juego por 1 jugador durante 2 minutos. El oficial A debe abandonar la zona de cambios","d":"Descalificación para el oficial A del equipo BLANCO (tarjeta roja mostrada por los árbitros); el equipo BLANCO se reduce en el terreno de juego por 1 jugador durante 2 minutos","e":"Descalificación para el oficial A del equipo BLANCO con informe escrito (tarjetas roja y azul mostradas por los árbitros); el equipo BLANCO e reduce en el terreno de juego por 1 jugador durante 2 minutos"},"a":["d"]},{"id":"16.24","q":"NEGRO 11 marca un gol. Mientras lanza, es empujado lateralmente por BLANCO 10, por lo que pierde parcialmente el control de su cuerpo. Los árbitros sancionan a BLANCO 10 con una exclusión de 2 minutos. BLANCO 10 abandona el terreno de juego. Los árbitros dan la señal para el saque de centro posterior y, antes de que se ejecute el saque de centro, BLANCO 9 entra en el terreno de juego como jugador adicional. El delegado pita y se detiene el reloj. El marcador mural muestra que quedan 1 minuto y 58 segundos de la exclusión de BLANCO 10. ¿Cuál es la decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 9","b":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","c":"Durante 1 minuto y 58 segundos, el equipo BLANCO se queda con 2 jugadores menos en pista. Después de 1 minuto y 58 segundos, la primera exclusión acaba y el equipo BLANCO se queda con 1 jugador menos en la pista durante otros 2 segundos","d":"El juego se reanuda con un saque de centro para el equipo BLANCO","e":"El juego se reanuda con un golpe franco para el equipo NEGRO","f":"Tiempo Muerto"},"a":["a","c","e","f"]},{"id":"16.25","q":"El equipo BLANCO tiene la posesión del balón y el balón está en juego. El oficial B del equipo BLANCO se queja de una exclusión no aplicada al equipo NEGRO. El delegado interrumpe el juego y el oficial B recibe una tarjeta amarilla. Debido a esta sanción y antes de que se reanude el juego, se queja de nuevo y los árbitros le sancionan con una exclusión de 2 minutos. El oficial B entonces llama “Idiota” al árbitro. ¿Cuál es la decisión correcta?","o":{"a":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos","b":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","c":"El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos","d":"Descalificación sin informe escrito para el oficial B del equipo BLANCO (tarjeta roja mostrada por los árbitros)","e":"Descalificación con informe escrito para el oficial B del equipo BLANCO (tarjetas roja y azul mostradas por los árbitros)","f":"Es posible sancionar a otro oficial del equipo BLANCO más adelante en el partido con tarjeta amarilla y/o exclusión de 2 minutos","g":"La tarjeta amarilla, la exclusión de 2 minutos y la descalificación son anotadas en el acta del partido","h":"El partido se reanuda con un golpe franco para el equipo BLANCO","i":"El partido se reanuda con un golpe franco para el equipo NEGRO"},"a":["c","e","f","i"]},{"id":"17.1","q":"Los árbitros tienen opiniones distintas sobre qué equipo debe ejecutar un saque de banda. ¿Cómo se debería actuar?","o":{"a":"El árbitro central decide","b":"El árbitro de portería decide","c":"Los dos árbitros toman una decisión conjunta después de consultarse","d":"Tiempo Muerto","e":"No es necesario un Tiempo Muerto pero el saque de banda es ejecutado después del toque de silbato"},"a":["c","d"]},{"id":"17.2","q":"La señal automática del reloj mural no funciona. El cronometrador no conoce el problema y no reacciona aunque el tiempo de juego ya ha terminado. En este caso, ¿quién debe dar la señal final?","o":{"a":"Solo el anotador","b":"Solo el árbitro central","c":"Solo el delegado","d":"Solo uno de los árbitros","e":"Solo el cronometrador","f":"Ya sea el cronometrador, el delegado o uno de los árbitros"},"a":["f"]},{"id":"17.3","q":"NEGRO 2 ha cometido una infracción. El árbitro central decide descalificación de NEGRO 2 (tarjeta roja mostrada por los árbitros) y golpe franco. El árbitro de portería decide 2 minutos de exclusión para NEGRO 2 y lanzamiento de 7 metros. ¿Cómo se sancionará al jugador y cómo debe reanudarse el partido?","o":{"a":"Si no se llega a una decisión conjunta, exclusión de 2 minutos para NEGRO 2","b":"Si no se llega a una decisión conjunta, descalificación para NEGRO 2 (tarjeta roja mostrada por los árbitros)","c":"Si no se llega a una decisión conjunta, golpe franco","d":"Si no se llega a una decisión conjunta, lanzamiento de 7 metros","e":"Los árbitros deben llegar a una decisión conjunta"},"a":["b","d","e"]},{"id":"17.4","q":"¿En caso de duda, quién decide sobre la exactitud del tiempo de juego?","o":{"a":"El cronometrador y el anotador","b":"Los dos árbitros conjuntamente","c":"El cronometrador","d":"Los dos árbitros y el cronometrador conjuntamente"},"a":["b"]},{"id":"17.5","q":"¿Qué sanciones necesitan explicarse en el acta de partido?","o":{"a":"Todas las descalificaciones, excepto aquellas causadas por 3 exclusiones de 2 minutos","b":"Todas las sanciones excepto las advertencias","c":"Todas las exclusiones y todas las descalificaciones","d":"Las descalificaciones debido a faltas peligrosas o conductas antideportivas graves en los últimos treinta segundos de juego, si la acción se realiza para evitar que los contrarios puedan crear una ocasión de gol","e":"Las descalificaciones debidas a una conducta extremadamente antideportiva","f":"Cualquier sanción progresiva durante los últimos treinta segundos del partido, si la acción se realiza para evitar que los contrarios puedan crear una ocasión de gol"},"a":["e"]},{"id":"17.6","q":"¿Quién está autorizado a dirigirse a los árbitros durante el partido?","o":{"a":"Todos los jugadores","b":"Todos los oficiales","c":"El oficial responsable de equipo","d":"El capitán del equipo"},"a":["c"]},{"id":"17.7","q":"Los árbitros tienen diferentes opiniones sobre el tiempo que resta por jugar. El árbitro de portería (que es el designado en primer lugar) quiere que se jueguen 50 segundos más, mientras que el árbitro central dice que faltan 42 segundos. ¿Decisión correcta?","o":{"a":"Se aplica la mayor cantidad de tiempo – 50 segundos","b":"El árbitro designado en primer lugar decide – 50 segundos","c":"El árbitro central es el responsable – 42 segundos","d":"Los dos árbitros deben tomar una decisión conjunta"},"a":["d"]},{"id":"17.8","q":"Al comienzo del partido, ¿quién comienza como árbitro central y quién como árbitro de portería?","o":{"a":"El árbitro designado en primer lugar comienza como árbitro central","b":"El árbitro designado en primer lugar comienza como de árbitro de portería","c":"Los árbitros realizan un sorteo para decidir dónde comienza cada uno","d":"Los árbitros son libres para decidir su propia elección"},"a":["d"]},{"id":"17.9","q":"Los dos árbitros pitan después de un choque entre dos jugadores. El árbitro central señala falta en ataque, pero el árbitro de portería indica una infracción del defensor. ¿Cómo debería decidirse?","o":{"a":"La decisión del árbitro de portería es válida","b":"La decisión del árbitro central es válida","c":"Los árbitros deben alcanzar una decisión conjunta tras una consulta entre ambos","d":"Tiempo Muerto obligatorio","e":"El Tiempo Muerto es necesario sólo si la decisión conjunta alcanzada es en contra del equipo atacante","f":"El Tiempo Muerto no es obligatorio si los árbitros están usando un equipo electrónico para su comunicación interna"},"a":["c","d"]},{"id":"18.1","q":"¿Qué indican las Reglas de Juego con respecto a la distribución del trabajo entre el cronometrador y el anotador?","o":{"a":"El control de la entrada y salida de los cambios es controlado solamente por el cronometrador","b":"Generalmente, sólo el cronometrador debería interrumpir el juego cuando esto sea necesario","c":"El anotador debe pitar si observa que un cambio entra en el terreno de juego demasiado pronto","d":"Si no hay un marcador mural, el cronometrador mantiene a los equipos informados sobre cuánto tiempo han jugado o cuanto les queda por jugar","e":"La cuenta del número de ataques, cuando un jugador está cumpliendo 3 ataques después de recibir asistencia médica en la pista, es una tarea conjunta para el cronometrador y el anotador"},"a":["b","d","e"]},{"id":"18.2","q":"BLANCO 5 tiene una clara ocasión de marcar gol. El oficial A del equipo BLANCO insulta al cronometrador. El cronometrador hace sonar la señal acústica justo en el momento en que BLANCO 5 va a lanzar a portería. La acción solo ha sido observada por el cronometrador. ¿Decisión correcta?","o":{"a":"Golpe franco a favor del equipo NEGRO","b":"Sanción disciplinaria al oficial A del equipo BLANCO","c":"Golpe franco a favor del equipo BLANCO","d":"Lanzamiento de 7 metros a favor del equipo BLANCO","e":"Informe escrito"},"a":["c","e"]},{"id":"18.3","q":"El oficial responsable del equipo BLANCO insulta al anotador, sin que esta situación sea observada por los árbitros. En la siguiente interrupción, el anotador informa a los árbitros de lo ocurrido. ¿Decisión correcta?","o":{"a":"Descalificación al oficial responsable del equipo BLANCO, informe escrito (tarjetas roja y azul mostradas por los árbitros)","b":"Exclusión de 2 minutos para el oficial responsable del equipo BLANCO","c":"Informe escrito","d":"Amonestación para el oficial responsable del equipo BLANCO","e":"No es posible aplicar sanciones"},"a":["c","e"]},{"id":"18.4","q":"El equipo BLANCO tiene el balón en la línea de golpe franco del equipo NEGRO. El delegado interrumpe el juego y explica a los árbitros que el oficial A del equipo NEGRO le ha insultado. ¿Decisión correcta?","o":{"a":"Advertencia verbal al oficial A del equipo NEGRO; informe escrito","b":"Descalificación al oficial A del equipo NEGRO; informe escrito (tarjetas roja y azul mostradas por los árbitros)","c":"El partido se reanuda con golpe franco para el equipo BLANCO desde la zona de cambios del equipo NEGRO","d":"El partido se reanuda con golpe franco para el equipo BLANCO desde la línea de golpe franco del equipo NEGRO"},"a":["b","d"]},{"id":"18.5","q":"El equipo BLANCO tiene el balón en la línea de golpe franco del equipo NEGRO. El cronometrador interrumpe el juego y explica a los árbitros que el oficial A del equipo BLANCO le ha insultado. ¿Decisión correcta?","o":{"a":"Informe escrito","b":"Exclusión de 2 minutos para el oficial A del equipo BLANCO; informe escrito","c":"El partido se reanuda con golpe franco para el equipo NEGRO desde la zona de cambios del equipo BLANCO","d":"El partido se reanuda con el lanzamiento para el equipo BLANCO que corresponda a la situación de juego"},"a":["a","d"]},{"id":"18.6","q":"Durante el partido, el oficial A del equipo BLANCO se mueve repetidamente hacia la mesa del cronometrador para dar instrucciones desde ahí. Mientras lo hace, protesta contra las decisiones de los árbitros. Debido al ruido del terreno de juego, los árbitros no se percatan de ello. ¿Decisión correcta?","o":{"a":"El cronometrador interrumpe el juego inmediatamente e informa a los árbitros del comportamiento del oficial A","b":"El cronometrador espera a la siguiente interrupción del juego e informa a los árbitros del comportamiento del oficial A","c":"Sanción progresiva para el oficial A del equipo BLANCO","d":"Ninguna sanción es posible"},"a":["b","d"]},{"id":"18.7","q":"¿Cuándo debería el anotador/cronometrador informar a los árbitros, si ha existido una infracción en la zona de cambios que no ha sido observada por parte de los árbitros?","o":{"a":"Inmediatamente","b":"En el momento de la siguiente interrupción del juego"},"a":["b"]},{"id":"18.8","q":"Si el Delegado Técnico interrumpe el partido por una infracción de uno de los equipos, ¿el partido se reanuda con la posesión del balón para el otro equipo?","o":{"a":"Sí","b":"No"},"a":["a"]},{"id":"SAR.1","q":"¿Cuál debería ser la distancia entre la línea central y el comienzo de los banquillos de los equipos?","o":{"a":"1 metro","b":"2 metros","c":"3 metros","d":"3,5 metros"},"a":["d"]},{"id":"SAR.2","q":"El oficial A del equipo BLANCO ya ha recibido una amonestación mientras se encontraba sentado en el banquillo. Él ahora abandona la zona de cambios y se sienta en el área de espectadores. Desde esta posición continúa protestando contra las decisiones arbitrales. ¿Decisión correcta?","o":{"a":"Ninguna acción es posible","b":"Exclusión de 2 minutos para el oficial A del equipo BLANCO","c":"Descalificación del oficial A del equipo BLANCO (tarjeta roja mostrada por los árbitros)","d":"Descalificación del oficial A del equipo BLANCO, informe escrito (tarjetas roja y azul mostradas por los árbitros)","e":"El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos"},"a":["b","e"]}];
const app=document.getElementById('app');
let qs,i,sel,ans;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){
  app.innerHTML=`<h1>IHF Rules Quiz</h1><div class="card"><p>25 random questions from the IHF Rules of the Game catalogue (${Q.length} in the pool). Some questions have more than one correct answer: pick them all. A question only counts if your selection matches exactly.</p><button class="btn" id="go">Start quiz</button></div>`;
  document.getElementById('go').onclick=start;
}
function start(list){qs=Array.isArray(list)?shuffle(list):shuffle(Q).slice(0,25);i=0;ans=[];show()}
function show(){
  const q=qs[i];sel=new Set();
  app.innerHTML=`<div class="mut">Question ${i+1} of ${qs.length}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card"><p style="margin-top:0"><b>${esc(q.q)}</b></p><div class="mut">Select all that apply</div>
  ${Object.entries(q.o).map(([k,v])=>`<button class="opt" data-k="${k}"><b>${k})</b><span>${esc(v)}</span></button>`).join('')}</div>
  <button class="btn" id="nx" disabled>${i==qs.length-1?'Finish':'Next'}</button>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('sel');document.getElementById('nx').disabled=!sel.size});
  document.getElementById('nx').onclick=()=>{ans.push([...sel].sort());i++;i<qs.length?show():done()};
  window.scrollTo(0,0);
}
const ok=(q,a)=>a.join()==q.a.slice().sort().join();
function done(){
  const res=qs.map((q,k)=>[q,ans[k],ok(q,ans[k])]);
  const right=res.filter(r=>r[2]).length,pct=Math.round(right/qs.length*100);
  const wrong=res.filter(r=>!r[2]);
  app.innerHTML=`<div class="card"><div class="mut" style="text-align:center">Your score</div><div class="score">${pct}%</div><div class="mut" style="text-align:center">${right} correct · ${wrong.length} wrong</div></div>
  <div class="row">${wrong.length?'<button class="btn" id="retry">Retry my mistakes</button>':''}<button class="btn alt" id="again">New quiz</button></div>
  <div class="row" id="flt" style="margin:14px 0 4px"><button class="btn alt" data-f="all">All (${qs.length})</button><button class="btn alt" data-f="w">Wrong (${wrong.length})</button><button class="btn alt" data-f="r">Right (${right})</button></div>
  <div id="list"></div>`;
  const list=document.getElementById('list');
  const draw=f=>{
    document.querySelectorAll('#flt button').forEach(b=>b.style.background=b.dataset.f==f?'color-mix(in srgb,var(--ac) 15%,transparent)':'');
    list.innerHTML=res.map(([q,a,g],k)=>({q,a,g,k})).filter(x=>f=='all'||(f=='w'?!x.g:x.g)).map(({q,a,g,k})=>`<div class="card rv ${g?'good':''}"><p style="margin-top:0"><span class="mut">${k+1}. ${q.id}</span><span class="tag" style="color:var(--${g?'ok':'no'})">${g?'✓ RIGHT':'✗ WRONG'}</span><br><b>${esc(q.q)}</b></p>
    ${Object.entries(q.o).map(([key,v])=>{const c=q.a.includes(key),m=a.includes(key);
      return `<div class="li ${c?'c':(m?'w':'')}"><b>${key})</b> ${esc(v)}${c?'<span class="tag" style="color:var(--ok)">CORRECT'+(m?'':' (missed)')+'</span>':(m?'<span class="tag" style="color:var(--no)">YOUR PICK</span>':'')}</div>`}).join('')}</div>`).join('')||'<p class="mut">Nothing here.</p>';
  };
  document.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>draw(b.dataset.f));
  draw(wrong.length?'w':'all');
  document.getElementById('again').onclick=()=>start();
  const r=document.getElementById('retry');if(r)r.onclick=()=>start(wrong.map(w=>w[0]));
  window.scrollTo(0,0);
}
home();
</script></body></html>
