ateralmente por BLANCO 7. Aunque pierde parcialmente el control de su cuerpo, es capaz de lanzar con fuerza a portería. El balón golpea la cabeza del portero BLANCO 1, cambia de dirección y entra en la portería. ¿Cuál es la decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco a favor del equipo BLANCO","c":"Exclusión de 2 minutos para NEGRO 8","d":"Exclusión de 2 minutos para BLANCO 7","e":"Lanzamiento de 7 metros para el equipo NEGRO","f":"Tiempo Muerto"},"a":["a","d","f"]},{"id":"8.77","q":"El pivote NEGRO 8 recibe el balón. Cuando intenta girar hacia la portería, es fuertemente sujetado y derribado por BLANCO 7. Sin embargo, recupera el control total de su cuerpo. Sin ningún jugador entre él y el portero, salta por encima del área de portería. Lanza con fuerza y total control de su cuerpo. El balón golpea al portero BLANCO 1 en la cabeza. La cabeza es el primer punto de contacto con el balón. El balón cambia de dirección y entra en la portería. ¿Cuál es la decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO","e":"Exclusión de 2 minutos para el equipo NEGRO 8","f":"Exclusión de 2 minutos para el equipo BLANCO 7","g":"Tiempo Muerto"},"a":["b","e","f","g"]},{"id":"8.78","q":"El extremo NEGRO 3 tiene una clara ocasión de gol y lanza a portería. El balón toca el lateral de la cabeza del portero BLANCO 1 sin cambiar de dirección. El balón entra en la portería. ¿Cuál es la decisión correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 3","b":"Sanción progresiva para BLANCO 1","c":"Gol","d":"Golpe franco para el equipo BLANCO"},"a":["c"]},{"id":"8.79","q":"El extremo NEGRO 3 tiene una clara ocasión de gol y lanza a portería. El balón golpea el lateral de la cabeza del portero BLANCO 1 y cambia de dirección. La cabeza es el primer punto de contacto con el balón. El balón entra en la portería. BLANCO 1 cae al suelo, se lleva la mano a la cabeza y necesita claramente asistencia médica. ¿Cuál es la decisión correcta?","o":{"a":"Tiempo Muerto","b":"Los árbitros solicitan asistencia médica para BLANCO 1 haciendo las gestoformas 15 y 16","c":"Exclusión de 2 minutos para NEGRO 3","d":"Sanción progresiva para BLANCO 1","e":"Gol","f":"Golpe franco para el equipo BLANCO","g":"Después de recibir asistencia médica BLANCO 1 debe abandonar la pista y sólo puede volver a entrar después de que su equipo haya completado 3 ataques"},"a":["a","b","c","f"]},{"id":"8.80","q":"El equipo NEGRO está atacando a falta de 10 segundos para el final del partido. Mientras el balón está en juego, el jugador NEGRO 10 golpea intencionadamente con su codo al jugador BLANCO 7 en la cara. El jugador BLANCO 7 cae al suelo lesionado y queda ahí tendido. ¿Cuál es la decisión correcta?","o":{"a":"Descalificación sin informe escrito para NEGRO 10 (tarjeta roja mostrada por los árbitros)","b":"Descalificación con informe escrito para NEGRO 10 (tarjetas roja y azul mostradas por los árbitros).","c":"Tiempo Muerto","d":"El partido se reanuda con un golpe franco para el equipo BLANCO","e":"El partido se reanuda con un lanzamiento de 7 metros para el equipo BLANCO","f":"Los árbitros deben dar permiso a dos personas del equipo BLANCO para que entren en el terreno de juego y asistan a BLANCO 7","g":"Después de recibir asistencia médica en el terreno de juego, BLANCO 7 debe abandonar el terreno de juego y solo puede volver a entrar tras el tercer ataque de su equipo"},"a":["b","c","d","f"]},{"id":"8.81","q":"El equipo BLANCO juega con la portería vacía. El jugador NEGRO 7 intercepta un pase y lanza a la portería vacía. El jugador BLANCO 4 atrapa el balón mientras corre justo fuera del área de portería. No puede detenerse y entra en el área de portería con ambos pies y el balón en las manos. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Sanción progresiva para BLANCO 4","d":"Exclusión de 2 minutos para BLANCO 4","e":"No hay sanción","f":"Tiempo Muerto"},"a":["a","e"]},{"id":"9.1","q":"BLANCO 7 está situado en el centro de la defensa de su equipo cuando NEGRO 3 intenta pasar el balón en bote. BLANCO 7 de forma intencionada intenta parar el pase con su pie y no es la primera vez que lo hace. El balón golpea en su pie y se introduce en la portería del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Gol para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Exclusión de 2 minutos para BLANCO 7"},"a":["b","d"]},{"id":"9.2","q":"Un lanzamiento de BLANCO 5 es rechazado por el poste de la portería del equipo NEGRO. Golpea en el pie de NEGRO 3, que está en el terreno de juego, y entra en la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Gol para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Saque de portería para el equipo NEGRO"},"a":["b"]},{"id":"9.3","q":"El portero BLANCO 1 para un lanzamiento y el rechace golpea en la espalda del defensor BLANCO 3, que está 2 metros dentro del área de portería. El balón entra en la portería del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Sanción progresiva para BLANCO 3","d":"Gol para el equipo NEGRO"},"a":["d"]},{"id":"9.4","q":"El portero BLANCO 1 retiene el balón durante 4 segundos en una posición en la que tres cuartas partes del balón ya han rebasado la línea de gol. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Saque de portería para el equipo BLANCO"},"a":["c"]},{"id":"9.5","q":"BLANCO 3 penetra en el área de portería de su equipo para intentar parar un lanzamiento con el pie pero el balón, desviado por su pie, entra en la portería del equipo BLANCO. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Gol para el equipo NEGRO","d":"Saque de portería para el equipo BLANCO"},"a":["c"]},{"id":"9.6","q":"BLANCO 11 ejecuta una vaselina por encima del portero NEGRO 1, que está adelantado a su portería. Antes que el balón rebase la línea de portería, el gerente del equipo NEGRO, que está sentado en la primera fila del público detrás de la portería y no está incluido en el acta del partido, despeja el balón. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo BLANCO","b":"Gol para el equipo BLANCO","c":"Descalificación para el gerente del equipo NEGRO con informe escrito (tarjetas roja y azul mostradas por los árbitros)","d":"Informe escrito"},"a":["b","d"]},{"id":"9.7","q":"A 2 segundos de finalizar el partido y con el marcador 25-25, un oficial del equipo BLANCO (equipo local), que no está inscrito en el acta de partido, intercepta el balón que se dirige a la portería vacía. Por esta acción evita un gol a favor del equipo NEGRO. Inmediatamente después, suena la señal final. ¿Qué es lo correcto?","o":{"a":"Marcador final 25-25","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Marcador final 25-26","d":"Descalificación del oficial con informe escrito (tarjetas roja y azul mostradas por los árbitros)","e":"Informe escrito"},"a":["c","e"]},{"id":"9.8","q":"Gol para el equipo NEGRO después de un lanzamiento de 7 metros de NEGRO 9. El equipo BLANCO ejecuta inmediatamente un saque de centro rápido después del toque de silbato del árbitro. Tras dos pases BLANCO 4 marca un gol. En ese momento el cronometrador pita e informa que NEGRO 9, que entretanto ha regresado al banquillo, le restaban 20 segundos por cumplir de una exclusión de 2 minutos en el momento del lanzamiento de 7 metros. ¿Cuál es la decisión correcta?","o":{"a":"El lanzamiento de 7 metros para el equipo NEGRO debe ser repetido","b":"NEGRO 9 recibe una exclusión adicional de 2 minutos","c":"Ambos goles son válidos","d":"Ninguno de los dos goles es válido"},"a":["b","c"]},{"id":"9.9","q":"Justo antes del final del partido, cuando el resultado es 22-21 para su equipo, BLANCO 5 ha ejecutado correctamente un saque de centro. El balón va hacia atrás en dirección a la portería del equipo BLANCO. El portero BLANCO 1 no toca el balón porque se encuentra dentro de su área de portería y el balón entra dentro de la portería. Los compañeros de BLANCO 5 habían cruzado la línea central después del toque de silbato del árbitro pero antes de que el balón fuera jugado, corriendo en dirección a la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Repetición del saque de centro después de toque de silbato","d":"Sanción progresiva para BLANCO 5","e":"Tiempo Muerto"},"a":["a"]},{"id":"9.10","q":"BLANCO 9 trata de parar un lanzamiento bajo con la parte más baja de su pierna, pero al hacerlo desvía el balón, que va dentro de su propia portería. Esta es la segunda vez que trata de detener un lanzamiento con su pierna. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Exclusión de 2 minutos para BLANCO 9"},"a":["a","c"]},{"id":"10.1","q":"El equipo BLANCO gana el sorteo y elige comenzar sacando. El representante del equipo NEGRO quiere cambiar de campo. ¿Decisión correcta?","o":{"a":"Cambio de campo","b":"Cambio de campo si el equipo BLANCO está de acuerdo","c":"Repetir el sorteo","d":"No cambiar de campo"},"a":["a"]},{"id":"10.2","q":"El equipo BLANCO gana el sorteo y elige cambiar de campo. El equipo NEGRO quiere que el equipo BLANCO ejecute el saque de centro. ¿Decisión correcta?","o":{"a":"El equipo BLANCO realiza el saque de centro","b":"Cambio de campo y el equipo NEGRO realiza el saque de centro","c":"Repetir el sorteo","d":"Los representantes de ambos equipos deben llegar a un acuerdo"},"a":["b"]},{"id":"10.3","q":"(Sin área de saque de centro). ¿Desde dónde se puede ejecutar el saque de centro?","o":{"a":"Hasta 3 metros detrás de la línea central en su propia mitad del terreno","b":"Hasta 3 metros de la línea central en la mitad del terreno de los contrarios","c":"En el centro del terreno de juego con un pie en la línea central y el otro pie detrás de la línea con una tolerancia hacia ambos lados de aproximadamente 1’5 metros"},"a":["c"]},{"id":"10.4","q":"(Sin área de saque de centro). Con el marcador 15-15 y justo antes del final del partido, el equipo NEGRO marca el 15-16. El equipo BLANCO quiere ejecutar el saque de centro rápidamente. El jugador con el balón está en el centro del terreno de juego con un pie delante de la línea central y el otro detrás de la línea. ¿Decisión correcta?","o":{"a":"Corrección; después, toque de silbato para volver a ejecutar el saque de centro","b":"La posición es correcta; toque de silbato para ejecutar el saque de centro","c":"Tiempo Muerto; corrección; toque de silbato para ejecutar el saque de centro"},"a":["a"]},{"id":"10.5","q":"El equipo BLANCO está a punto de ejecutar un saque de centro. El portero NEGRO 1 no está todavía en su área de portería. El árbitro central pita para reanudar el partido y el jugador BLANCO 9 inmediatamente marca un gol. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO desde la línea central","b":"Repetir el saque de centro","c":"Gol para el equipo BLANCO","d":"Golpe franco para el equipo NEGRO"},"a":["c"]},{"id":"10.6","q":"(Sin área de saque de centro). ¿Qué afirmaciones sobre el saque de centro son correctas?","o":{"a":"El saque de centro debe ser ejecutado dentro de los 3 segundos siguientes al toque de silbato, desde el centro del terreno y debe ser ejecutado hacia la mitad del terreno del equipo contrario","b":"Un gol contra el equipo contrario puede ser marcado directamente por medio de un saque de centro","c":"Las posiciones incorrectas de los defensores deben ser corregidas","d":"Si el lanzador bota el balón después del toque de silbato para la ejecución, debe señalarse un golpe franco a favor de los oponentes","e":"Los compañeros del lanzador están autorizados a cruzar la línea de centro, antes de que el saque haya sido ejecutado"},"a":["b","d","e"]},{"id":"10.7","q":"(Sin área de saque de centro). NEGRO 6 recibe el balón y está en el centro del terreno de juego con un pie sobre la línea central y el otro en su propia mitad del campo. Los árbitros pitan. Antes de que el balón haya salido de su mano, sobrepasa la línea central. En ese momento hay varios jugadores del equipo BLANCO en el campo del equipo NEGRO. ¿Qué se debería hacer?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco para el equipo BLANCO","c":"Corrección de las posiciones del equipo BLANCO y repetición del saque de centro después del toque de silbato","d":"Corrección de la posición de NEGRO 6 y repetición del saque de centro después del toque de silbato"},"a":["b"]},{"id":"10.8","q":"(Con área de saque de centro). El equipo BLANCO marca un gol. El equipo NEGRO quiere ejecutar un saque de centro rápido. NEGRO 9 está en posición correcta dentro del área de saque de centro. Después de que los árbitros piten la ejecución, NEGRO 9 da 6 pasos con el balón dentro del área de saque de centro. En los 3 segundos siguientes a la señal del silbato para la ejecución del saque de centro, NEGRO 9 lanza el balón a la portería vacía del equipo BLANCO. ¿Cuál es la decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Corrección, y nuevo saque de centro después del toque de silbato de los árbitros"},"a":["a"]},{"id":"10.9","q":"(Con área de saque de centro). El equipo BLANCO marca un gol. El equipo NEGRO quiere ejecutar un saque de centro rápido. NEGRO 9 recibe el balón. Tiene el balón y un pie completamente dentro del área de saque de centro. El otro pie está fuera del área de saque de centro. Los árbitros pitan la ejecución del saque de centro. Antes de que NEGRO 9 mueva el otro pie dentro del área de saque de centro, lanza el balón a la portería vacía del equipo BLANCO. ¿Cuál es la decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Corrección, nuevo saque de centro para el equipo NEGRO después del toque de silbato de los árbitros","d":"El lanzamiento se ejecuta correctamente ya que los árbitros han aprobado la posición del lanzador al dar la señal con el silbato para la ejecución","e":"Los árbitros deberían haber esperado hasta que el lanzador estuviera dentro del área de saque de centro con el balón y todo su cuerpo antes de dar la señal con el silbato para la ejecución del saque"},"a":["a","d","e"]},{"id":"10.10","q":"(Con área de saque de centro). El equipo NEGRO quiere ejecutar un saque de centro rápido desde el área de saque de centro. Al mismo tiempo que NEGRO 8 corre con su cuerpo y el balón completamente dentro del área de saque de centro, el jugador BLANCO 7 también se encuentra dentro del área de saque de centro, corriendo en dirección a su propia portería. Sin compañeros de equipo en la dirección del jugador BLANCO 7, el jugador NEGRO 8 lanza el balón hacia la espalda del jugador BLANCO 7. El jugador BLANCO 7 se encuentra dentro del área de saque de centro cuando el balón le golpea. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Sanción progresiva para BLANCO 7","e":"Sanción progresiva para NEGRO 8","f":"Exclusión de 2 minutos para NEGRO 8"},"a":["a","f"]},{"id":"10.11","q":"(Con área de saque de centro). ¿Cuál/es de las siguientes afirmaciones sobre el área de saque de centro es/son incorrecta/s?","o":{"a":"La señal del silbato para la ejecución del saque de centro puede darse cuando el lanzador tiene una parte del cuerpo dentro del área de saque de centro","b":"No existe ninguna restricción en cuanto a las posiciones de los compañeros del lanzador durante la ejecución de un saque de centro","c":"El lanzador puede salirse del área de saque de centro durante la ejecución del saque","d":"Se permite a un jugador del equipo defensor interceptar el balón después de la ejecución, incluso si el balón todavía se encuentra dentro del área de saque de centro","e":"No se permite al ejecutor botar el balón después de la señal del silbato para la ejecución"},"a":["a","b","c","d"]},{"id":"10.12","q":"(Con área de saque de centro). El equipo BLANCO juega con 7 jugadores de pista y marca un gol. El equipo NEGRO quiere ejecutar un saque de centro rápido. NEGRO 6 está completamente dentro del área de saque de centro con el balón. Los árbitros pitan la ejecución. BLANCO 8 entra claramente en el área de saque de centro con los brazos activos intentando bloquear el balón e interfiere en la ejecución. Aun así, NEGRO 6, que tiene todo su cuerpo y el balón dentro del área de saque de centro, ejecuta el saque de centro como un tiro a portería vacía. El balón cruza la línea exterior de gol. ¿Cuál es la decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Nuevo saque de centro tras la señal del silbato","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO","e":"Tiempo Muerto","f":"Sanción progresiva para BLANCO 8","g":"Exclusión de 2 minutos para BLANCO 8","h":"Descalificación para BLANCO 8 (tarjeta roja mostrada por los árbitros)"},"a":["d","e","g"]},{"id":"10.13","q":"(Con área de saque de centro). ¿Cuál de las siguientes afirmaciones sobre el área de saque de centro es correcta?","o":{"a":"El saque de centro debe ejecutarse en los 3 segundos siguientes a la señal del silbato para la ejecución","b":"Un saque de centro puede suponer un gol para el equipo ejecutor","c":"En relación con el saque de centro, deben corregirse las posiciones incorrectas de los jugadores defensores","d":"Si el ejecutor salta después de la señal del silbato para la ejecución del lanzamiento, la decisión correcta es golpe franco para los adversarios","e":"Los compañeros del lanzador no pueden cruzar la línea central en ningún momento antes de la señal del silbato para la ejecución del lanzamiento"},"a":["a","b","d"]},{"id":"10.14","q":"(Con área de saque de centro). ¿Cuándo puede un árbitro pitar la ejecución de un saque de centro?","o":{"a":"Cuando el ejecutor del saque tiene al menos un pie y el balón dentro del área de saque de centro, y el otro pie no está fuera del área de saque de centro en la mitad del campo contrario","b":"Cuando el ejecutor del saque tiene al menos un pie dentro del área de saque de centro, y el otro pie no está fuera del área de saque de centro en la mitad del campo contrario, pero el balón está todavía fuera del área de saque de centro","c":"Cuando el ejecutor del saque tiene al menos un pie y el balón dentro del área de saque de centro, y el otro pie está fuera del área de saque de centro en la mitad del campo contrario","d":"Cuando el ejecutor del saque tiene al menos un pie y el balón dentro del área de saque de centro, el otro pie no está fuera del área de saque de centro en la mitad del campo contrario, pero los compañeros del ejecutor del saque están dentro del área de saque de centro en la mitad del campo contrario","e":"Cuando el ejecutor del saque se encuentra dentro del área de saque de centro con todo su cuerpo y el balón"},"a":["e"]},{"id":"11.1","q":"BLANCO 3 ejecuta un saque de banda estando a 2 metros de la línea de banda. ¿Decisión correcta?","o":{"a":"Ninguna, puesto que está permitido","b":"Golpe franco para el equipo NEGRO","c":"Repetir el saque de banda sin toque de silbato","d":"Repetir el saque de banda después del toque de silbato"},"a":["d"]},{"id":"11.2","q":"NEGRO 4 está situado con un pie en la línea de banda y el otro en el terreno de juego. Está ejecutando un saque de banda y marca un gol directamente. ¿Decisión correcta?","o":{"a":"Gol para el equipo NEGRO","b":"Repetición del saque de banda del equipo NEGRO después del toque de silbato","c":"Golpe franco para el equipo BLANCO","d":"Saque de portería para el equipo BLANCO"},"a":["a"]},{"id":"11.3","q":"BLANCO 6 ejecuta un saque de banda estando con un pie dentro del terreno de juego y el otro fuera de la línea de banda. Lanza el balón dentro de la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Repetición del saque de banda para el equipo BLANCO después del toque de silbato","b":"Golpe franco para el equipo NEGRO","c":"Gol para el equipo BLANCO","d":"Saque de portería para el equipo NEGRO"},"a":["a"]},{"id":"11.4","q":"BLANCO 11 realiza un lanzamiento a portería. El balón rechazado por el larguero golpea un objeto fijo que cuelga del techo por encima del área de portería del equipo NEGRO. Desde ahí el balón cae en los brazos del portero NEGRO 1. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo NEGRO","b":"Saque de banda para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO después del toque de silbato","d":"Saque de banda para el equipo NEGRO después del toque de silbato","e":"Tiempo Muerto obligatorio"},"a":["b"]},{"id":"11.5","q":"¿Cuándo está permitido que el equipo defensor esté a menos de 3 metros del balón durante la ejecución del lanzamientos tras una interrupción del juego?","o":{"a":"Tan pronto como el árbitro haya dado la señal para la ejecución del saque","b":"Cuando el balón haya salido de la mano del jugador que ejecuta un golpe franco","c":"En caso de golpe franco o saque de banda, cuando los jugadores estén situados en su propia línea del área de portería","d":"Durante la ejecución de un saque de portería o de un saque de banda, cuando el jugador defensor se halle fuera del área de portería o del área de saque de banda"},"a":["b","c","d"]},{"id":"11.6","q":"BLANCO 5 recepciona incorrectamente un pase. Corre detrás del balón y lo para justo antes que cruce la línea de banda, pero él no puede evitar cruzar esta línea. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco para el equipo NEGRO","c":"Saque de banda para el equipo NEGRO"},"a":["a"]},{"id":"12.1","q":"Mientras ejecuta un saque de portería, el portero BLANCO 1 toca la línea del área de portería con un pie. ¿Decisión correcta?","o":{"a":"Repetir el saque de portería, después del toque de silbato","b":"Golpe franco a favor del equipo NEGRO","c":"Permitir que el juego continúe sin interrupción"},"a":["c"]},{"id":"12.2","q":"Después del toque de silbato para la ejecución de un lanzamiento de 7 metros, el portero BLANCO 12 pisa con un pie la línea de restricción del portero. El lanzamiento de 7 metros se va por encima del larguero. ¿Decisión correcta?","o":{"a":"Repetición del lanzamiento de 7 metros, después del toque de silbato","b":"Dado que no fue gol, el juego continúa con un saque de portería","c":"La posición del portero es correcta"},"a":["b","c"]},{"id":"12.3","q":"El portero BLANCO 1 detiene un lanzamiento y se lanza a por el balón que rueda hacia el área de juego. NEGRO 7 está solo y preparado para recoger el balón. En el último momento, BLANCO 1 usa sus manos para golpear el balón, que cruza la línea exterior de la línea de gol. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Saque de banda para el equipo NEGRO","c":"Saque de portería para el equipo BLANCO","d":"Golpe franco para el equipo BLANCO"},"a":["c"]},{"id":"12.4","q":"Cuando el portero BLANCO 12 está ejecutando un saque de portería deja caer el balón. El balón golpea su pie. Desde allí el balón cruza la línea del área de portería hacia el área de juego. BLANCO 12 corre tras el balón, lo recoge y vuelve con él a su área de portería, para repetir el saque de portería. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Tiempo Muerto","d":"Corrección, saque de portería después de toque de silbato"},"a":["d"]},{"id":"12.5","q":"¿Cuándo se considera ejecutado un saque de portería de forma que el balón pueda ser jugado por un jugador de campo?","o":{"a":"Cuando el balón está todavía en el aire encima del área de portería","b":"Cuando el balón ha salido de la mano del portero, ha rebasado la línea del área de portería y entrado en el área de juego","c":"Cuando el balón ha abandonado la mano del portero","d":"Cuando un compañero de equipo del portero ha tocado el balón"},"a":["b"]},{"id":"12.6","q":"El portero BLANCO 12 está ejecutando un saque de portería. NEGRO 10, que está situado fuera del área de portería, intenta legalmente ganar la posesión del balón. Lo consigue y marca un gol. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Gol para el equipo NEGRO","c":"Saque de portería para el equipo BLANCO","d":"Sanción progresiva contra NEGRO 10"},"a":["b"]},{"id":"12.7","q":"El portero BLANCO 12 detiene un lanzamiento despejando el balón por la línea exterior de gol fuera de la portería. ¿Que gestoforma(s) debería realizar el árbitro de portería si es necesario?","o":{"a":"Número 8: Saque de portería","b":"Número 9: Golpe franco – dirección","c":"Primero número 9: Golpe franco – dirección, luego número 8: Saque de portería","d":"Primero número 8: Saque de portería, luego número 9: Golpe franco – dirección"},"a":["a"]},{"id":"12.8","q":"El portero BLANCO 1 pierde el balón mientras está ejecutando un saque de portería. El balón bota en dirección al terreno de juego donde NEGRO 6 está esperando el balón. BLANCO 2 se lanza sobre el área de portería y empuja el balón, que está en el aire, hacia la línea de banda.","o":{"a":"Saque de portería para el equipo BLANCO después del toque de silbato","b":"Saque de banda para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["a"]},{"id":"12.9","q":"¿Qué afirmaciones son correctas respecto al saque de portería?","o":{"a":"El saque de portería se considera ejecutado cuando el balón ha salido de la mano del portero","b":"Los jugadores contrarios deben mantenerse a una distancia de 3 metros","c":"El saque de portería se considera ejecutado cuando el balón ha salido de la mano del portero y ha rebasado la línea del área de portería","d":"Los jugadores contrarios están autorizados a permanecer inmediatamente fuera de la línea del área de portería"},"a":["c","d"]},{"id":"12.10","q":"Saque de portería a favor del equipo NEGRO. El portero NEGRO 1 tiene prisa porque su equipo va perdiendo. Cuando está ejecutando el saque de portería el balón se resbala de su mano y va hacia NEGRO 6, que está aún dentro del área de portería. NEGRO 6 devuelve el balón a NEGRO 1 con su pie. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo NEGRO después de toque de silbato","b":"Golpe franco contra el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo BLANCO"},"a":["a"]},{"id":"12.11","q":"¿Cuáles de las siguientes afirmaciones con respecto al saque de portería son correctas?","o":{"a":"Los jugadores del otro equipo deben permanecer fuera de la línea de golpe franco hasta que el balón esté en juego","b":"Los jugadores del otro equipo deben permanecer fuera de la línea del área de portería, a 3 metros de distancia de la posición desde donde el portero ejecuta el saque de portería","c":"A los jugadores del otro equipo se les permite tocar el balón antes de que éste cruce la línea del área de portería","d":"El portero no puede marcar un gol en su propia portería cuando ejecuta un saque de portería","e":"El portero no puede marcar directamente un gol directamente en la portería contraria con un saque de portería","f":"Al portero no se le permite tocar la línea del área de portería cuando está ejecutando un saque de portería"},"a":["d"]},{"id":"13.1","q":"Golpe franco para el equipo BLANCO. Antes de que BLANCO 5 pueda recoger el balón, NEGRO 6 se anticipa, lo pone bajo su brazo y corre hacia su portería. Después de dar algunos pasos, hace rodar el balón hacia BLANCO 5. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 6","b":"Golpe franco para el equipo BLANCO después del toque de silbato","c":"Amonestación para NEGRO 6","d":"El juego continúa sin interrupción","e":"Tiempo Muerto"},"a":["a","b","e"]},{"id":"13.2","q":"NEGRO 7 está en posesión del balón e intenta iniciar un contraataque pero es sujetado por BLANCO 17. El árbitro va a pitar cuando observa la posibilidad de aplicar la ley de la ventaja para el equipo NEGRO, porque NEGRO 8 ha recibido el balón y lanza a la portería del equipo BLANCO. El portero BLANCO 12 para el lanzamiento y quiere iniciar un contraataque. Ambos equipos ya tenían 3 amonestaciones. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Exclusión de 2 minutos para BLANCO 17","c":"Saque de portería para el equipo BLANCO","d":"Tiempo Muerto","e":"Golpe franco para el equipo NEGRO"},"a":["b","c","d"]},{"id":"13.3","q":"Golpe franco a favor del equipo BLANCO. NEGRO 6 tiene el balón y se lo lleva con él a 4 metros del lugar en que debe ejecutarse el golpe franco. ¿Decisión correcta?","o":{"a":"Amonestación para NEGRO 6","b":"Exclusión de 2 minutos para NEGRO 6","c":"Descalificación para NEGRO 6 (tarjeta roja mostrada por los árbitros)","d":"Golpe franco para el equipo BLANCO, desde el lugar en se cometió la infracción que originó el golpe franco","e":"Golpe franco a favor del equipo BLANCO, desde el lugar donde está el balón"},"a":["b","d"]},{"id":"13.4","q":"Se sanciona un golpe franco contra BLANCO 4, quien entonces coge el balón, cruza el área de portería y deja el balón en el suelo. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 4","b":"Amonestación para BLANCO 4","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Golpe franco para el equipo NEGRO"},"a":["a","d"]},{"id":"13.5","q":"BLANCO 5 está en posesión del balón, cuando el oficial B del equipo BLANCO protesta a los árbitros. Los árbitros pitan, ordenan un Tiempo Muerto y amonestan al oficial B del equipo BLANCO. ¿Cómo debe reanudarse el juego?","o":{"a":"Golpe franco para el equipo NEGRO junto a la zona de cambios del equipo BLANCO","b":"Golpe franco para el equipo BLANCO junto a la zona de cambios del equipo BLANCO","c":"Golpe franco para el equipo BLANCO, ejecutado desde el lugar donde el balón se encontraba cuando el juego fue interrumpido","d":"Saque de banda para el equipo NEGRO junto a la zona de cambios del equipo BLANCO"},"a":["a"]},{"id":"13.6","q":"El árbitro central interrumpe el partido aunque no ha habido ninguna infracción a las reglas por ninguno de los equipos. No hay ningún Tiempo Muerto solicitado. NEGRO 13 había lanzado el balón en dirección a la portería del equipo BLANCO inmediatamente antes de la interrupción. Después del toque de silbato el balón entra en la portería sin ninguna oportunidad del portero BLANCO 1 para evitarlo. ¿Cómo debería continuarse el partido?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Gol para el equipo NEGRO"},"a":["a"]},{"id":"13.7","q":"BLANCO 7 está en contraataque. Lanza a portería y golpea a NEGRO 12 en la cabeza con el balón, por lo que NEGRO 12 se derrumba. El balón rechazado de la cabeza del portero va a BLANCO 9 que está junto a la línea del área de portería. BLANCO 9 lanza el balón a la portería vacía. Justo antes de que el balón atraviese la línea de gol los árbitros pitan e interrumpen el juego. El portero NEGRO 12 necesita atención médica en la pista. ¿Decisión correcta?","o":{"a":"Gol para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Golpe franco para el equipo BLANCO después del toque de silbato","d":"Tiempo Muerto","e":"NEGRO 12 debe de abandonar la pista y solo puede volver a entrar después del tercer ataque de su equipo"},"a":["c","d"]},{"id":"13.8","q":"NEGRO 9 recibe un golpe franco, pero BLANCO 5 está aún en posesión del balón. BLANCO 5 se dirige hacia el árbitro y le entrega amablemente el balón. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 5 y golpe franco para el equipo NEGRO ejecutado desde el lugar donde se encuentra el balón","b":"Amonestación para BLANCO 5 y golpe franco para el equipo NEGRO ejecutado desde el lugar donde se encuentra el balón","c":"Exclusión de 2 minutos para BLANCO 5 y golpe franco para el equipo NEGRO ejecutado desde el lugar donde se cometió la falta","d":"Amonestación para BLANCO 5 y golpe franco para el equipo NEGRO ejecutado desde el lugar donde se cometió la falta"},"a":["c"]},{"id":"13.9","q":"Cambio antirreglamentario de BLANCO 5, justo después de que los árbitros hayan señalado un lanzamiento de 7 metros para el equipo BLANCO. ¿Decisión correcta?","o":{"a":"Golpe franco a favor del equipo NEGRO","b":"Lanzamiento de 7 metros a favor del equipo BLANCO","c":"Exclusión de 2 minutos para BLANCO 5","d":"Amonestación para el oficial responsable del equipo BLANCO"},"a":["b","c"]},{"id":"13.10","q":"¿Cuáles de las siguientes afirmaciones sobre el lugar de ejecución de un golpe franco son correctas?","o":{"a":"Si el balón no se coloca en el suelo inmediatamente después de una decisión de golpe franco, se permite a los contrarios ejecutar el golpe franco en el lugar donde se encuentre el balón","b":"Tras un cambio antirreglamentario, el golpe franco puede ejecutarse donde está el balón, en vez de ejecutarlo desde la zona de cambios, si esto es más ventajoso para el equipo que va a ejecutar el saque","c":"Después de un juego pasivo, el golpe franco siempre se ejecuta desde el sitio donde se encontraba el balón en el momento de señalar el golpe franco","d":"Para ejecutar un golpe franco desde la línea de centro, la tolerancia a ambos lados es la misma que en un saque de centro."},"a":["b","c","d"]},{"id":"13.11","q":"NEGRO 11 tiene el balón en ataque y trata de sobrepasar BLANCO 2. Debido a un toque de silbato desde la zona de espectadores, BLANCO 2 deja de defender. Entonces NEGRO 11 queda sólo para lanzar. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo NEGRO","b":"Tiempo Muerto; consulta con el cronometrador","c":"Golpe franco para el equipo BLANCO","d":"Golpe franco para el equipo NEGRO"},"a":["b","d"]},{"id":"13.12","q":"El equipo BLANCO tiene el balón junto a la línea de golpe franco del equipo NEGRO. El oficial A del equipo NEGRO protesta tan fuertemente una decisión de los árbitros que éstos interrumpen el partido. ¿Decisión correcta?","o":{"a":"Sanción progresiva para el oficial A del equipo NEGRO","b":"Golpe franco a favor del equipo BLANCO junto a la zona de cambios del equipo NEGRO","c":"Golpe franco a favor del equipo BLANCO junto a la línea de golpe franco del equipo NEGRO"},"a":["a","c"]},{"id":"13.13","q":"Amonestación para NEGRO 6. En el momento del toque de silbato para la ejecución del golpe franco a favor del equipo BLANCO, el árbitro central no ve que BLANCO 11 se encuentra entre la línea del área de portería y la de golpe franco. BLANCO 11 recibe el balón y tiene una clara ocasión de gol. El árbitro de portería sí que se da cuenta. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Repetición del golpe franco después de la corrección y del toque de silbato","c":"El árbitro de portería decide un golpe franco para el equipo NEGRO","d":"El árbitro de portería ordena una amonestación para BLANCO 11","e":"Tiempo Muerto"},"a":["b"]},{"id":"13.14","q":"El equipo BLANCO está en posesión del balón. El equipo NEGRO ya se ha posicionado en defensa. BLANCO 8 está corriendo cerca de la línea de banda. BLANCO 4 pasa el balón a BLANCO 8. BLANCO 8 choca con un fotógrafo, que camina entre las gradas y el terreno de juego y toca la línea de banda. BLANCO 8 no logra atrapar el balón y pierde el control del cuerpo. Antes de que los árbitros interrumpan el juego, el balón pasa la línea de banda. ¿Cuál es la decisión correcta?","o":{"a":"El juego se reinicia con un saque de banda para el equipo NEGRO","b":"El juego se reinicia con un golpe franco para el equipo BLANCO","c":"Tiempo Muerto","d":"Informe escrito"},"a":["b","c","d"]},{"id":"13.15","q":"El equipo NEGRO está atacando. Los árbitros otorgan un golpe franco a NEGRO 2. Antes de que NEGRO 2 pueda ejecutar el golpe franco, NEGRO 11 tira de BLANCO 8 hacia abajo. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO después de la señal del silbato","b":"Golpe franco para el equipo BLANCO después de la señal del silbato","c":"Tiempo Muerto","d":"Sanción progresiva para NEGRO 11","e":"Exclusión de 2 minutos para NEGRO 11","f":"Descalificación para NEGRO 11 (tarjeta roja mostrada por los árbitros)"},"a":["a","c","e"]},{"id":"14.1","q":"El resultado del partido es 20:20. NEGRO 7 intercepta un pase del equipo BLANCO y comienza un contraataque sin que nadie del equipo BLANCO sea capaz de seguirle. Un espectador entra corriendo al terreno de juego y derriba a NEGRO 7, lo cual provoca una tangana con aún más espectadores dentro del terreno de juego. El oficial A del equipo NEGRO golpea al espectador que había parado a NEGRO 7. ¿Decisión correcta?","o":{"a":"Suspensión definitiva del partido","b":"Tiempo Muerto, lanzamiento de 7 metros para el equipo NEGRO, descalificación del oficial A del equipo NEGRO, reducción de un jugador del equipo NEGRO en el terreno durante 2 minutos. Informe escrito (tarjetas roja y azul mostradas por los árbitros)","c":"Tiempo Muerto, lanzamiento de 7 metros para el equipo NEGRO, descalificación del oficial A del equipo NEGRO, reducción de un jugador del equipo NEGRO en el terreno durante 2 minutos (tarjeta roja mostrada por los árbitros)","d":"Tiempo Muerto, lanzamiento de 7 metros para el equipo NEGRO, 2 minutos de exclusión para el oficial A del equipo NEGRO, reducción de un jugador del equipo NEGRO en el terreno durante 2 minutos"},"a":["b"]},{"id":"14.2","q":"Saque de banda para el equipo NEGRO. NEGRO 7 lo ejecuta correctamente y observa que el portero BLANCO 12 se encuentra parado lejos de su rtido ha terminado. Los árbitros determinan que quedan por jugar 20 segundos. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO, junto a la mesa del cronometrador","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Informe escrito","d":"Golpe franco para el equipo BLANCO, desde el lugar donde estaba el balón en el momento en que sonó la señal"},"a":["b","c"]},{"id":"14.14","q":"¿Cuál(es) de las afirmaciones siguientes con respecto a la ejecución de un lanzamiento de 7 metros es/son correctas?","o":{"a":"El jugador que ejecuta el lanzamiento tiene permitido situarse hasta un metro por detrás de la línea de 7 metros","b":"Los árbitros deben conceder un Tiempo Muerto si el equipo defensor está cambiando los porteros","c":"El portero recibirá una sanción progresiva si traspasa repetidamente la línea de restricción del portero","d":"Los jugadores del equipo defensor deben estar siempre a 3 metros del lanzador"},"a":["a"]},{"id":"14.15","q":"BLANCO 5 está en posesión del balón y salta desde la esquina derecha hacia el área de portería del equipo NEGRO y choca con NEGRO 11, quién está con su brazos levantados unos 50cm dentro del área de portería. NEGRO 11 ha hecho esto por tercera vez en el partido ¿decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo BLANCO","b":"Falta en ataque contra BLANCO 5","c":"Exclusión de 2 minutos para NEGRO 11","d":"Amonestación para NEGRO 11"},"a":["a","c"]},{"id":"14.16","q":"BLANCO 6 está corriendo un contraataque y tiene una clara ocasión de gol cuando las luces del pabellón se apagan. ¿Cuál/es de las siguientes afirmaciones es/son correctas?","o":{"a":"Los árbitros esperan al resultado de la clara ocasión de gol","b":"Los árbitros interrumpen el partido inmediatamente y conceden un Tiempo Muerto","c":"Después de que las luces estén funcionando de nuevo, el partido se reanuda con un golpe franco a favor del equipo BLANCO","d":"Después de que las luces estén funcionando de nuevo, el partido se reanuda co o Muerto","d":"Exclusión de 2 minutos para BLANCO"},"a":["a"]},{"id":"14.21","q":"El equipo BLANCO está atacando y juega 7 contra 6 con la portería vacía. NEGRO 5 intercepta un pase. NEGRO 5 inmediatamente trata de lanzar directamente hacia la portería vacía. En ese momento, BLANCO 6 lo empuja desde atrás, por lo que pierde parcialmente el control del cuerpo y falla el gol. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Tiempo Muerto","d":"Exclusión de 2 minutos para BLANCO 6","e":"Descalificación para BLANCO 6 (tarjeta roja mostrada por los árbitros)"},"a":["b","c","d"]},{"id":"14.22","q":"El equipo BLANCO está atacando y juega 7 contra 6 con la portería vacía. BLANCO 11 falla un pase, y el balón cruza la línea de banda, generando un saque de banda para el equipo NEGRO. NEGRO 9 toma el balón y ejecuta el saque de banda como un intento de lanzar el balón directamente hacia la portería vacía. El balón es bloqueado por BLANCO 4, que está demasiado cerca durante la ejecución del saque. ¿Cuál es la decisión correcta?","o":{"a":"Corrección de la posición de BLANCO 4","b":"Sanción progresiva para BLANCO 4","c":"Repetición del lanzamiento de saque lateral para el equipo NEGRO después de la señal de silbato","d":"Golpe franco para el equipo NEGRO","e":"Lanzamiento de 7 metros para el equipo NEGRO","f":"Exclusión de 2 minutos para BLANCO 4"},"a":["e","f"]},{"id":"14.23","q":"El equipo BLANCO está atacando y juega 7 contra 6 con la portería vacía. Los árbitros pitan falta de ataque contra BLANCO 7. NEGRO 8 toma el balón y está listo para ejecutar el golpe franco como un intento de lanzar el balón hacia la portería vacía. Mientras lo hace y antes de que el balón haya abandonado su mano, BLANCO 7 lo derriba por detrás. Poco después, el portero BLANCO 16 entra en su área de portería después de una sustitución correcta con BLANCO 2. ¿Cuál es la decisión correcta?","o":{"a":"Sanción progresiva pa
