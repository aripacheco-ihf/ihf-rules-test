e 7 metros para el equipo BLANCO","d":"Sanción progresiva para NEGRO 2"},"a":["b"]},{"id":"6.21","q":"El portero NEGRO 1 ha parado un lanzamiento y quiere pasar el balón a NEGRO 6, que está preparado para un contraataque. Cuando NEGRO 1 hace el pase, toca la línea del área de portería. NEGRO 6 consigue el balón y marca un gol. ¿Decisión correcta?","o":{"a":"El gol es válido","b":"Golpe franco para el equipo BLANCO","c":"Corrección y repetición del saque de portería después del toque de silbato","d":"El gol no es válido"},"a":["a"]},{"id":"6.22","q":"BLANCO 6 está en un contraataque. Salta, lanza a portería y aterriza en el área de portería del equipo NEGRO. El portero NEGRO 12 bloquea el lanzamiento, y el balón va a BLANCO 11, que marca un gol mientras BLANCO 6 está en el área de portería entre él y el portero NEGRO 12. ¿Decisión correcta?","o":{"a":"Gol para el equipo BLANCO","b":"Saque de portería para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO"},"a":["b"]},{"id":"6.23","q":"El equipo BLANCO está atacando y juega con su portería vacía. BLANCO 11 lanza a portería. El portero NEGRO 1 para el lanzamiento. Ejecuta el saque de portería hacia la portería vacía. BLANCO 10 intenta parar el lanzamiento. Salta desde fuera de su propia área de portería y, mientras está en el aire sobre la zona de portería, toca el balón. El balón cruza la línea de banda. Después de tocar el balón, BLANCO 10 cae dentro del área de portería. ¿Cuál es la decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Saque de banda para el equipo NEGRO","e":"Sanción progresiva para BLANCO 10"},"a":["d"]},{"id":"6.24","q":"El equipo BLANCO está atacando y juega con su portería vacía. BLANCO 11 lanza a portería. El portero NEGRO 1 para el lanzamiento. Ejecuta el saque de portería hacia la portería vacía. BLANCO 10 intenta parar el lanzamiento. Salta desde fuera de su propia área de portería y, mientras está en el aire sobre el área de portería, atrapa el balón y cae dentro del área de portería con el balón en sus manos. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Lanzamiento de 7 metros para el equipo NEGRO","c":"Exclusión de 2 minutos para BLANCO 10","d":"No hay sanción"},"a":["b","c"]},{"id":"6.25","q":"NEGRO 5 lanza a portería. El portero BLANCO 12 detiene el balón. Al hacerlo, el jugador BLANCO 12 se golpea la cabeza contra el poste y cae al suelo lesionado. El jugador NEGRO 3 aprovecha el rebote del portero y tiene una clara ocasión de gol en la línea del área del equipo BLANCO. ¿Cuál es la decisión correcta?","o":{"a":"Ley de la ventaja para NEGRO 3","b":"Interrumpir el partido inmediatamente","c":"El partido se reanuda con un lanzamiento de 7 metros para el equipo NEGRO","d":"El partido se reanuda con un golpe franco para el equipo NEGRO","e":"Tiempo Muerto","f":"Los árbitros dan permiso a dos personas del equipo BLANCO para que entren en el terreno de juego y den asistencia médica a BLANCO 12","g":"Tras recibir asistencia médica, BLANCO 12 debe abandonar el terreno de juego y solo puede volver a entrar tras el tercer ataque de su equipo","h":"Tras recibir asistencia médica, BLANCO 12 puede seguir jugando sin abandonar el terreno de juego"},"a":["b","d","e","f","g"]},{"id":"7.1","q":"El balón está en el aire yendo hacia la línea lateral. BLANCO 3 logra jugar el balón con su mano hacia BLANCO 7, antes de que el balón cruce la línea. Mientras lo hace, BLANCO 3 pisa la línea lateral con un pie. BLANCO 7 coge el balón y marca un gol. ¿Decisión correcta?","o":{"a":"Saque de banda para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Gol","d":"Exclusión de 2 minutos para BLANCO 3"},"a":["b"]},{"id":"7.2","q":"Un pase arriesgado de NEGRO 3 a NEGRO 11. Cuando el balón está en el aire, NEGRO 11 se da cuenta de que no lo podrá coger, así que lo golpea con su puño en dirección a NEGRO 9 que está parado en la mitad del terreno de juego. ¿Cuál es la decisión correcta?","o":{"a":"El juego continua sin interrupción","b":"Golpe franco para el equipo BLANCO desde la posición de NEGRO 9","c":"Golpe franco para el equipo BLANCO desde la posición de NEGRO 11","d":"Exclusión de 2 minutos para NEGRO 11"},"a":["a"]},{"id":"7.3","q":"BLANCO 4 coge el balón cuando está parado. Salta y cae sobre su pie derecho. Después salta sobre su pie izquierdo y lanza. ¿Cuántos pasos ha realizado BLANCO 4?","o":{"a":"1","b":"2","c":"3","d":"4"},"a":["b"]},{"id":"7.4","q":"Un jugador salta para coger el balón. Cae al suelo con ambos pies simultáneamente. Luego levanta su pie derecho para dar un paso hacia un lado y arrastra su pie izquierdo hasta el otro. ¿Cuántos pasos ha realizado?","o":{"a":"1","b":"3","c":"0","d":"2"},"a":["a"]},{"id":"7.5","q":"Un jugador en suspensión coge el balón, cae sobre su pie derecho y se desplaza con ese mismo pie. Posteriormente, apoya primero el pie izquierdo en el suelo y luego el derecho para lanzar a portería. ¿Cuántos pasos ha realizado?","o":{"a":"3","b":"2","c":"1","d":"0"},"a":["b"]},{"id":"7.6","q":"BLANCO 5 está intentando controlar el balón y finalmente lo consigue. Entonces da tres pasos, bota el balón una vez y vuelve a dar otros tres pasos antes de marcar un gol. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Gol","c":"Saque de portería para el equipo NEGRO","d":"Saque de banda para el equipo NEGRO"},"a":["b"]},{"id":"7.7","q":"BLANCO 5 quiere iniciar un ataque. Bota el balón mientras da 5 pasos. Entonces coge el balón y lo pasa. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"El juego continúa sin interrupción","d":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["c"]},{"id":"7.8","q":"NEGRO 6 recepciona el balón, resbala y cae. Tendido sobre su espalda, lanza el balón a NEGRO 9. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"El juego continúa sin interrupción","c":"Golpe franco para el equipo NEGRO"},"a":["b"]},{"id":"7.9","q":"BLANCO 3 corre entre dos adversarios para empujar el balón en la dirección de su trayectoria. BLANCO 3 coge de nuevo el balón antes que haya tocado el suelo, y el camino hacia la portería del equipo NEGRO está ahora libre. BLANCO 3 bota el balón una vez y marca gol. ¿Decisión correcta?","o":{"a":"Gol","b":"Golpe franco para el equipo NEGRO","c":"Saque de portería para el equipo NEGRO"},"a":["b"]},{"id":"7.10","q":"Después de botar el balón una vez BLANCO 7 quiere pasar el balón a BLANCO 5, pero BLANCO 5 está cubierto por un contrario. BLANCO 7 está tan confuso que se le cae el balón, pero logra cogerlo de nuevo antes de que toque el suelo. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco para el equipo NEGRO","c":"Golpe franco para el equipo BLANCO"},"a":["b"]},{"id":"7.11","q":"¿Cómo se sanciona el juego pasivo repetido?","o":{"a":"Golpe franco y amonestación","b":"Golpe franco y exclusión de 2 minutos","c":"Golpe franco","d":"Golpe franco y descalificación (tarjeta roja mostrada por los árbitros)"},"a":["c"]},{"id":"7.12","q":"Posteriormente a un lanzamiento a portería de BLANCO 4 el balón es rechazado por el poste de la portería del equipo NEGRO, golpea al árbitro que estaba en el área de portería y, a causa de esto, el balón sale del terreno de juego por la línea de banda y no por la línea de portería. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Saque de banda para el equipo NEGRO","c":"Saque de portería para el equipo NEGRO"},"a":["b"]},{"id":"7.13","q":"El equipo BLANCO ejecuta un saque de banda. BLANCO 5 lanza el balón dentro del terreno de juego, donde golpea al árbitro y luego entra en la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Repetición del lanzamiento después de toque de silbato","b":"Golpe franco para el equipo NEGRO","c":"Golpe franco para el equipo BLANCO","d":"Gol para el equipo BLANCO"},"a":["d"]},{"id":"7.14","q":"NEGRO 3 ejecuta un lanzamiento en suspensión y BLANCO 9 bloquea el balón. El balón cae al suelo donde BLANCO 9 lo recoge con ambas manos y comienza a botarlo mientras realiza el contraataque. Su lanzamiento acaba dentro de la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Gol para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Exclusión de 2 minutos para BLANCO 9","d":"Tiempo Muerto"},"a":["a"]},{"id":"7.15","q":"BLANCO 5 bota el balón a lo largo de la línea de banda. NEGRO 2 le obstruye correctamente. Para poder superar a NEGRO 2, BLANCO 5 pisa fuera de la línea de banda mientras continúa botando el balón. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Saque de banda para el equipo NEGRO","c":"Golpe franco para el equipo NEGRO","d":"El juego continúa sin interrupción"},"a":["c"]},{"id":"7.16","q":"Después de un pase impreciso de BLANCO 3 a BLANCO 9, el balón rueda en dirección a la línea de banda, cerca de la zona de cambios del equipo BLANCO. NEGRO 10 se encuentra a un metro de distancia, listo para recoger el balón, cuando BLANCO 9 se lanza a por el balón y lo golpea con su puño en dirección al terreno de juego, hacia BLANCO 3. Como consecuencia del movimiento, BLANCO 9 se desliza fuera de la línea de banda y fuera del terreno de juego. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco para el equipo NEGRO","c":"Sanción progresiva para BLANCO 9","d":"Saque de banda para el equipo NEGRO"},"a":["a"]},{"id":"7.17","q":"NEGRO 7 del equipo atacante ocupa una posición fuera del terreno de juego sin tener el balón. Los árbitros indican al jugador que debe volver al terreno de juego pero éste no reacciona. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Golpe franco para el equipo BLANCO","c":"Sanción progresiva para NEGRO 7","d":"Saque de banda para el equipo BLANCO"},"a":["b"]},{"id":"7.18","q":"Un jugador salta sobre el área de portería del equipo adversario. Tiene un completo control del balón y de su cuerpo, y está en una buena posición para lanzar. Sin embargo, en vez de lanzar se da la vuelta en el aire y pasa el balón hacia atrás a un compañero de equipo, que posteriormente la vuelve a pasar. ¿Decisión correcta?","o":{"a":"Gesto de advertencia de juego pasivo","b":"Inmediato golpe franco debido al juego pasivo","c":"Inmediato golpe franco debido a una conducta antideportiva","d":"Sanción progresiva"},"a":["b"]},{"id":"7.19","q":"BLANCO 3 efectúa un lanzamiento a la portería del equipo NEGRO y el balón golpea en el poste. El balón rechazado vuelve rodando en dirección al área de juego. Junto a la línea de golpe franco, BLANCO 3 y NEGRO 4 se lanzan a por el balón sin ponerse mutuamente en peligro. NEGRO 4 logra golpear el balón en dirección a NEGRO 6, quien inicia un contraataque y marca gol. ¿Decisión correcta?","o":{"a":"Amonestación para NEGRO 4","b":"Gol para el equipo NEGRO","c":"Golpe franco para el equipo BLANCO o el equipo NEGRO, dependiendo de las circunstancias","d":"Saque de portería para el equipo NEGRO"},"a":["b"]},{"id":"7.20","q":"BLANCO 10 intenta pasar el balón a BLANCO 8 que está junto a la línea del área de portería del equipo NEGRO. NEGRO 10 está completamente quieto enfrente de BLANCO 8 cuando el balón golpea en su pie. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"El juego continúa sin interrupción","c":"Depende de quien consiga el balón"},"a":["b"]},{"id":"7.21","q":"BLANCO 15 corta un pase de NEGRO 9, después de esto, el balón rueda por el suelo. BLANCO 15 y NEGRO 9 se lanzan al suelo por el balón, BLANCO 15 coge el balón y resbala en el suelo, se levanta, da tres pasos y juega el balón hacia un compañero que consigue marcar gol. ¿Decisión correcta?","o":{"a":"Gol para el equipo el equipo BLANCO","b":"Golpe franco para el equipo NEGRO"},"a":["a"]},{"id":"7.22","q":"El equipo BLANCO está ganando por 24-23 en el minuto 57 pero tiene un jugador menos que los contrarios en el terreno de juego. El árbitro central ha concedido un golpe franco a favor de BLANCO 3. BLANCO 6 intenta manifiestamente ejecutar este golpe franco a varios metros del lugar correcto, incluso aunque el árbitro ha señalado muy claramente el lugar correcto. ¿Cuál es la decisión correcta?","o":{"a":"Corrección de la posición; señal de reanudación del partido; ninguna otra decisión","b":"Corrección de la posición; señal de reanudación del partido; los árbitros muestran el gesto de advertencia de juego pasivo","c":"Corrección de la posición; sanción progresiva para BLANCO 6; señal de reanudación del partido; los árbitros muestran el gesto de advertencia de juego pasivo"},"a":["b"]},{"id":"7.23","q":"El equipo NEGRO está jugando con un jugador menos. Los jugadores del equipo NEGRO ya ocupan sus posiciones en ataque y han empezado una fase de construcción. En este momento los jugadores NEGRO 6 y NEGRO 8 abandonar el terreno de juego para realizar un cambio. ¿Decisión correcta?","o":{"a":"Señal de advertencia de juego pasivo","b":"Señal de advertencia de juego pasivo, si no hay incremento de ritmo en 5 segundos","c":"Inmediato golpe franco a favor del equipo BLANCO por juego pasivo","d":"Amonestación para NEGRO 6 o NEGRO 8 en caso de repetición","e":"Exclusión de 2 minutos para NEGRO 6 o NEGRO 8 en caso de repetición"},"a":["a"]},{"id":"7.24","q":"¿Qué acciones cancelan la señal de advertencia de juego pasivo?","o":{"a":"Recuperar la posesión del balón por parte del equipo atacante después de que el portero haya rechazado un lanzamiento de 7 metros","b":"Recuperar la posesión del balón por parte del equipo atacante después de que el balón haya sido rechazado por los postes o el poste de la portería","c":"Tiempo Muerto de Equipo","d":"Cambio de ritmo evidente, antes de las próximas acciones pasivas del equipo","e":"Ninguna de las anteriores"},"a":["a","b"]},{"id":"7.25","q":"¿Cuáles de las siguientes instrucciones son correctas en relación con la señal de advertencia de juego pasivo (Gestoforma N.º 17)?","o":{"a":"Si se observa una tendencia hacia el juego pasivo, el árbitro central debe ser el primero en señalarla mediante la Gestoforma 17. Entonces el árbitro de portería levanta su brazo en la misma forma","b":"Si el equipo en posesión del balón solicita un Tiempo Muerto de Equipo después de haberse mostrado la señal de advertencia, entonces cuando se reanude el juego debe mostrarse nuevamente la misma señal","c":"Si el equipo en posesión del balón no realiza claros esfuerzos para llegar a una posición de lanzamiento a portería después de haberse mostrado la señal de advertencia, el árbitro de central o el árbitro de portería señalan un golpe franco debido al juego pasivo","d":"Después de la señal de advertencia, los árbitros deciden juego pasivo a más tardar, cuando un lanzamiento a portería no es ejecutado después de cuatro pases"},"a":["b","c","d"]},{"id":"7.26","q":"El equipo BLANCO retrasa la ejecución de un saque de centro. El equipo ya había sido advertido anteriormente por utilizar esa táctica. ¿Decisión correcta?","o":{"a":"El juego continúa sin interrupción","b":"Tiempo Muerto; saque de centro después de toque de silbato","c":"Tiempo Muerto; saque de centro después de toque de silbato; justo después señal de advertencia de juego pasivo","d":"Toque de silbato para la ejecución del saque de centro; inmediatamente después señal de advertencia de juego pasivo","e":"Sanción progresiva para el oficial responsable de equipo BLANCO"},"a":["d"]},{"id":"7.27","q":"¿Cuál(es) de las siguientes afirmaciones con respecto a la utilización de la señal de advertencia de juego pasivo es/son correctas?","o":{"a":"La señal de advertencia siempre debe finalizar cuando un oficial del equipo defensor recibe una sanción progresiva durante el transcurso del ataque","b":"Cuando la señal de advertencia se muestra por primera vez durante un ataque, los brazos deben bajarse después de 10 segundos aproximadamente","c":"La señal de advertencia debe repetirse como un recordatorio después de la primera interrupción, si es que ha sido mostrada antes de esa interrupción","d":"La señal de advertencia siempre debe finalizar cuando un jugador del equipo defensor recibe una sanción progresiva durante el transcurso del ataque","e":"Los árbitros deben de mostrar la señal de advertencia siempre cuando un jugador tiene claramente el balón bajo control"},"a":["a","d","e"]},{"id":"7.28","q":"¿Cuáles de las siguientes afirmaciones referentes al juego pasivo son correctas?","o":{"a":"A un equipo no se le permiten más de 5 segundos para pasar de la fase de construcción hasta la fase final del ataque","b":"Los árbitros deben tener en cuenta los cambios lentos y tardíos después que un saque de centro haya sido ejecutado","c":"Los árbitros deben observar si el equipo trata de incrementar su ritmo o ganar una ventaja espacial durante la fase de construcción","d":"Los árbitros deben controlar la existencia del juego pasivo en cuanto un equipo ha ganado la posesión del balón en su propia mitad del terreno","e":"A un equipo que ha tratado de realizar un contraataque se le debe permitir una sustitución normal cuando se pasa de la fase de contraataque a una fase natural de construcción"},"a":["b","c","d","e"]},{"id":"7.29","q":"El equipo BLANCO está en posesión del balón. Los árbitros muestran la señal de advertencia de juego pasivo. Después de un pase, BLANCO 5 realiza un lanzamiento a portería. El lanzamiento es bloqueado por NEGRO 2, y el balón rebotado vuelve a BLANCO 5, que pasa el balón a BLANCO 9. ¿Cuántos pases se han completado?","o":{"a":"3","b":"4","c":"5"},"a":["a"]},{"id":"7.30","q":"El equipo BLANCO está en posesión del balón. Los árbitros muestran la señal de advertencia de juego pasivo. BLANCO 9 intenta pasar el balón a BLANCO 2, pero el pase es bloqueado por NEGRO 8, y el balón vuelve a BLANCO 9. BLANCO 9 intenta penetrar en la defensa pero recibe un golpe franco. BLANCO 8 ejecuta el golpe franco pasando el balón a BLANCO 2. ¿Cuántos pases se han completado?","o":{"a":"1","b":"2","c":"3"},"a":["b"]},{"id":"7.31","q":"El equipo BLANCO está en posesión del balón. Los árbitros reconocen una tendencia pasiva en el juego de equipo BLANCO. Los árbitros muestran la señal de advertencia de juego pasivo. El equipo NEGRO ve que se muestra la señal de advertencia de juego pasivo y se vuelven más agresivos en la defensa, tratando de cometer un golpe franco. Después de 3 pases del equipo BLANCO, el equipo NEGRO comete un golpe franco. ¿decisión correcta?","o":{"a":"El equipo BLANCO tiene 4 pases para lanzar a portería","b":"El equipo BLANCO tiene 2 pases para lanzar a portería","c":"El equipo BLANCO tiene 1 pase para lanzar a portería","d":"El equipo BLANCO tiene que ejecutar el golpe franco como un lanzamiento directo a portería"},"a":["c"]},{"id":"7.32","q":"El equipo BLANCO está en ataque. Los árbitros reconocen una tendencia pasiva en el juego del equipo BLANCO y muestran la señal de advertencia de juego pasivo. El equipo BLANCO pasa el balón 4 veces, antes de que BLANCO 9 realice un lanzamiento a portería. El lanzamiento es bloqueado por NEGRO 3, y el balón sobrepasa la línea lateral y se produce un saque de banda para el equipo BLANCO. ¿Decisión correcta?","o":{"a":"La señal de advertencia ya no es válida","b":"El equipo BLANCO tiene 4 pases para realizar un lanzamiento a portería","c":"El equipo BLANCO tiene 2 pases para realizar un lanzamiento a portería","d":"El equipo BLANCO tiene 1 pase para realizar un lanzamiento a portería"},"a":["d"]},{"id":"7.33","q":"El equipo BLANCO está en posesión del balón, y debido a una tendencia pasiva en el juego del equipo BLANCO, los árbitros muestran la señal de advertencia de juego pasivo. Después de 4 pases BLANCO 5 lanza a portería. NEGRO 3 bloquea el lanzamiento, y el balón vuelve a BLANCO 5. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO","b":"El equipo BLANCO tiene 1 pase para realizar un lanzamiento a portería","c":"Continúa la señal de advertencia","d":"La advertencia previa ya no es válida","e":"El equipo BLANCO no tiene más pases antes de lanzar a portería"},"a":["b","c"]},{"id":"7.34","q":"El equipo NEGRO está atacando. Los árbitros muestran la señal de advertencia de juego pasivo. NEGRO 7 pasa el balón a NEGRO 11. NEGRO 11 intenta abrirse paso, pero es detenido por BLANCO 3. Los árbitros decretan golpe franco para el equipo NEGRO. NEGRO 11 ejecuta el golpe franco y pasa el balón a NEGRO 2, que intenta lanzar a portería, pero el lanzamiento es bloqueado por el defensor BLANCO 4, y el balón va hacia NEGRO 11. NEGRO 11 lanza a portería, pero BLANCO 5 lo empuja ligeramente, y el portero BLANCO 1 logra parar el lanzamiento. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO; nueva fase de construcción normal porque el equipo NEGRO consigue la posesión del balón tras un lanzamiento a portería","b":"Golpe franco para el equipo NEGRO; tras la señal de advertencia de juego pasivo, el equipo NEGRO ha realizado dos pases","c":"Golpe franco para el equipo NEGRO; tras la señal de advertencia de juego pasivo, el equipo NEGRO ha realizado tres pases","d":"Golpe franco para el equipo NEGRO; tras la señal de advertencia de juego pasivo, el equipo NEGRO ha realizado cuatro pases"},"a":["c"]},{"id":"7.35","q":"El marcador es 27-27 a falta de 20 segundos para el final del partido. El equipo BLANCO juega sin portero. Los árbitros muestran la señal de advertencia de pasivo. Después de tres pases, BLANCO 8 pasa el balón a BLANCO 7, que lanza a portería. El balón es bloqueado por el defensa NEGRO 2, y el balón pasa la línea lateral. Poco después de ejecutar el saque de banda, suena el silbato de la mesa, porque el equipo BLANCO ha solicitado un Tiempo Muerto de Equipo. ¿Cómo debe reanudarse el partido?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Saque de banda para el equipo BLANCO","c":"El lanzamiento debe ejecutarse como un tiro directo a portería","d":"Además de la posibilidad de ejecutar el lanzamiento como un tiro directo a portería, el lanzador puede pasar el balón a un compañero"},"a":["a","d"]},{"id":"7.36","q":"El equipo BLANCO ataca. Dos pases después de que los árbitros hayan mostrado la señal de advertencia de pasivo, BLANCO 7 lanza a portería. El balón es bloqueado por NEGRO 8. BLANCO 8 recibe el rebote e intenta lanzar a portería. De nuevo, el balón es bloqueado por NEGRO 8. BLANCO 8 recibe el balón tras el bloqueo y se lo pasa a BLANCO 6, que tiene una clara ocasión de gol. BLANCO 6 es derribado por detrás por NEGRO 7, perdiendo totalmente el control de su cuerpo. ¿Cuál es la decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Exclusión de 2 minutos para NEGRO 7","d":"Descalificación para NEGRO 7 (tarjeta roja mostrada por los árbitros)","e":"Golpe franco para el equipo BLANCO","f":"Tiempo muerto"},"a":["b","d","f"]},{"id":"8.1","q":"Durante un contraataque del equipo BLANCO, el jugador NEGRO 7 penetra en el terreno de juego como jugador adicional y sujeta al jugador BLANCO 5, de tal forma que destruye una clara ocasión de gol. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 7","b":"Descalificación para NEGRO 7 sin informe escrito (tarjeta roja mostrada por los árbitros)","c":"Descalificación para NEGRO 7 con informe escrito (tarjetas roja y azul mostradas por los árbitros)","d":"Golpe franco","e":"Lanzamiento de 7 metros"},"a":["c","e"]},{"id":"8.2","q":"NEGRO 8, que no está incluido en el acta de partido, llega tarde y se incorpora al terreno de juego directamente desde el vestuario. Evita una clara ocasión de gol al empujar por la espalda a BLANCO 6 que está lanzando en suspensión, de forma que BLANCO 6 pierde el control corporal. ¿Decisión correcta?","o":{"a":"Lanzamiento de 7 metros para el quipo BLANCO","b":"Golpe franco para el quipo BLANCO","c":"Descalificación del jugador NEGRO 8 sin informe escrito (tarjeta roja mostrada por los árbitros)","d":"Descalificación del jugador NEGRO 8 con informe escrito (tarjetas roja y azul mostradas por los árbitros)","e":"Sanción progresiva al “oficial responsable de equipo” del equipo NEGRO"},"a":["a","d","e"]},{"id":"8.3","q":"En el camino a los vestuarios durante el descanso, el oficial B del equipo BLANCO protesta de forma antideportiva a los árbitros. El oficial A del equipo BLANCO ya había recibido una amonestación durante la primera parte del partido. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para el oficial B del equipo BLANCO","b":"Descalificación para el oficial B del equipo BLANCO (tarjeta roja mostrada por los árbitros)","c":"El equipo BLANCO empieza el segundo tiempo con un jugador menos durante 2 minutos","d":"La sanción no es posible, pero hay informe escrito"},"a":["a","c"]},{"id":"8.4","q":"BLANCO 6 ya ha sido sancionado en dos ocasiones con exclusión de 2 minutos. Ahora BLANCO 6 comete un cambio antirreglamentario. ¿Cuál es la decisión si también tiene una conducta antideportiva grave después de que los árbitros le informasen del cambio antirreglamentario?","o":{"a":"Exclusión de 2 minutos al jugador BLANCO 6","b":"Descalificación de BLANCO 6 (Tarjeta roja mostrada por los árbitros)","c":"Descalificación de BLANCO 6 con informe escrito (Tarjetas roja y azul mostradas por los árbitros)","d":"El equipo BLANCO se reduce en 1 jugador en pista durante 2 minutos","e":"El equipo BLANCO se reduce en 2 jugadores en pista durante 2 minutos","f":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos"},"a":["a","c","f"]},{"id":"8.5","q":"BLANCO 2 está excluido 2 minutos pero el oficial A lo envía de nuevo al terreno de juego después de 1 minuto. Antes del toque de silbato del cronometrador, BLANCO 2 logra destruir una clara ocasión de gol del equipo NEGRO. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo NEGRO y una exclusión adicional para BLANCO 2","b":"Lanzamiento de 7 metros para el equipo NEGRO y una exclusión adicional para BLANCO 2 y reducción del número de jugadores del equipo BLANCO durante el tiempo restante de exclusión de BLANCO 2","c":"Lanzamiento de 7 metros, descalificación sin informe escrito para BLANCO 2 y reducción del número de jugadores del equipo BLANCO durante el tiempo restante de exclusión de BLANCO 2 (tarjeta roja mostrada por los árbitros)","d":"Lanzamiento de 7 metros, descalificación para BLANCO 2 y reducción del número de jugadores del equipo BLANCO durante el tiempo restante de exclusión de BLANCO 2; informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["d"]},{"id":"8.6","q":"Durante un ataque del equipo BLANCO, el pívot BLANCO 7, que no está en posesión del balón, bloquea a NEGRO 4 con su tronco. ¿Decisión correcta?","o":{"a":"Golpe franco a favor del equipo NEGRO","b":"Sanción progresiva para BLANCO 7","c":"El juego continúa sin interrupción"},"a":["c"]},{"id":"8.7","q":"El extremo BLANCO 4 tiene una clara ocasión de gol. En el último momento, NEGRO 7 intenta quitarle el balón de su mano, pero solamente consigue golpear su antebrazo. El balón se va fuera de la portería. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Exclusión de 2 minutos para NEGRO 7","d":"Amonestación para NEGRO 7","e":"Ninguna sanción para NEGRO 7"},"a":["b","e"]},{"id":"8.8","q":"BLANCO 6 está en un contraataque. El portero NEGRO 12 abandona su área de portería para conseguir la posesión del balón, pero choca con BLANCO 6. Sin embargo, un defensor podría haber detenido al atacante mediante métodos legales. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 12","b":"Descalificación para NEGRO 12 (tarjeta roja mostrada por los árbitros)","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Golpe franco para el equipo BLANCO","e":"Descalificación para NEGRO 12, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["b","c"]},{"id":"8.9","q":"BLANCO 2 quiere pasar el balón a un compañero de equipo que se encuentra en la otra mitad de la pista, pero este compañero es agarrado por NEGRO 5. NEGRO 5 ya había recibido una amonestación por haber chocado con un contrario que aún no tenía el balón. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Exclusión de 2 minutos para NEGRO 5","c":"Descalificación para NEGRO 5 (tarjeta roja mostrada por los árbitros)","d":"Informe escrito (tarjeta azul mostrada por los árbitros)"},"a":["a","b"]},{"id":"8.10","q":"El balón es jugado hacia el pívot BLANCO 9, que se encuentra solo en la línea de 6 metros del equipo NEGRO. NEGRO 2 tira hacia atrás el brazo del lanzador. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Exclusión de 2 minutos para NEGRO 2","d":"Descalificación para NEGRO 2 (tarjeta roja mostrada por los árbitros)","e":"Informe escrito (tarjeta azul mostradas por los árbitros)"},"a":["b","d"]},{"id":"8.11","q":"Poco después de que NEGRO 9 haya sido amonestado por empujar en el primer minuto del partido, NEGRO 7 agarra al pivote del equipo BLANCO (no hay clara ocasión de gol). ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Amonestación para NEGRO 7","d":"Exclusión de 2 minutos para NEGRO 7"},"a":["a","c"]},{"id":"8.12","q":"BLANCO 4 recibe el balón cerca del área de portería contraria, donde se encuentra solo ante el portero. Antes de que BLANCO 4 intente marcar un gol, NEGRO 3 lo derriba haciéndole caer al suelo de forma que pierde el balón. ¿Decisión correcta?","o":{"a":"Amonestación para NEGRO 3","b":"Exclusión de 2 minutos para NEGRO 3","c":"Descalificación para NEGRO 3 (tarjeta roja mostrada por los árbitros)","d":"Golpe franco para el equipo BLANCO","e":"Lanzamiento de 7 metros para el equipo BLANCO"},"a":["b","e"]},{"id":"8.13","q":"¿Cuándo un jugador debe ser descalificado (tarjeta roja o tarjetas roja y azul mostradas por los árbitros)?","o":{"a":"Por una falta que pone en peligro la integridad de un contrario","b":"Por conducta antideportiva extremadamente grave dentro o fuera del terreno de juego","c":"Por conducta antideportiva repetida dentro del terreno de juego","d":"Por un cambio antirreglamentario durante el tiempo de una exclusión (sin clara ocasión de gol)"},"a":["a","b"]},{"id":"8.14","q":"Durante un contraataque de BLANCO 5, el oficial C del equipo NEGRO corre desde su banquillo dentro del terreno de juego en dirección a su propia área de portería. BLANCO 5 queda tan confundido que detiene su carrera. En la opinión de los árbitros BLANCO 5 tenía una clara ocasión de gol. El oficial infractor no toca al jugador adversario que tenía el balón. La distancia más corta a BLANCO 5 fue de aproximadamente 10 metros. ¿Cuál es la decisión correcta?","o":{"a":"Tiempo Muerto","b":"Golpe franco para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Descalificación para el oficial C del equipo NEGRO (tarjeta roja mostrada por los árbitros)","e":"Descalificación para el oficial C del equipo NEGRO, informe escrito (tarjetas roja y azul mostradas por los árbitros)","f":"El equipo NEGRO se reduce en un jugador en pista durante 2 minutos","g":"El delegado o los árbitros tienen la posibilidad de aplicar la ley de la ventaja y pitar la infracción cuando la clara ocasión de gol haya terminado"},"a":["a","c","e","f"]},{"id":"8.15","q":"El equipo BLANCO inicia un contraataque. BLANCO 5 quiere hacer un pase en dirección a BLANCO 7 que está solo en la línea del área de portería del equipo NEGRO. Cuando BLANCO 5 pasa el balón, el oficial D del equipo NEGRO entra dentro del terreno de juego y coge el balón. ¿Cuál es la decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Exclusión de 2 minutos para el oficial D del equipo NEGRO","d":"Descalificación para el oficial D del equipo NEGRO (tarjeta roja mostrada por los árbitros)","e":"Descalificación para el oficial D del equipo NEGRO, informe escrito (tarjetas roja y azul mostradas por los árbitros)","f":"El equipo NEGRO se reduce en 1 jugador en pista durante 2 minutos"},"a":["b","e","f"]},{"id":"8.16","q":"¿Cuáles de las siguientes acciones deberían definirse como conducta antideportiva extremadamente grave y por tanto ser sancionadas con una descalificación con un informe escrito (tarjeta roja y tarjeta azul mostradas por los árbitros)?","o":{"a":"Defensa reiterada con el pie o la pierna por debajo de la rodilla por parte de un jugador de campo","b":"Un oficial de equipo destruye una clara ocasión de gol","c":"Escupir a otra persona","d":"Repetidos retrasos del juego con el propósito de perder tiempo"},"a":["b","c"]},{"id":"8.17","q":"Cuando los árbitros entran en el pabellón se encuentran con NEGRO 4, que viste el uniforme de jugador pero no está inscrito en el acta de partido. NEGRO 4 grita: “¡No, otra vez estos idiotas! Cuando se han jugado 12 minutos de partido, NEGRO 4 es añadido en el acta como jugador número 14 de su equipo. Los árbitros se dan cuenta. ¿Decisión correcta?","o":{"a":"Descalificación sin informe escrito de NEGRO 4 (tarjeta roja mostrada por los árbitros)","b":"El equipo NEGRO se reduce en un jugador durante 2 minutos","c":"El equipo NEGRO continúa sin reducción de jugadores en el terreno de juego","d":"Descalificación de NEGRO 4, informe escrito (tarjetas roja y azul mostradas por los árbitros)","e":"El equipo NEGRO puede añadir otro jugador y completar el número permitido de 16 jugadores"},"a":["c","d"]},{"id":"8.18","q":"Después de un golpe franco para el equipo BLANCO, el oficial C del equipo NEGRO entra en el terreno de juego y grita: “¡Eso debería ser un golpe franco para nosotros!” Los oficiales del equipo NEGRO no han sido sancionados anteriormente. ¿Decisión correcta?","o":{"a":"El oficial responsable del equipo NEGRO tiene que llevar fuera del pabellón al oficial C","b":"Exclusión de 2 minutos para el oficial C del equipo NEGRO, el equipo NEGRO se reduce en un jugador en pista durante 2 minutos","c":"Amonestación para el oficial C del equipo NEGRO","d":"Golpe franco para el equipo BLANCO"},"a":["c","d"]},{"id":"8.19","q":"El jugador BLANCO 3 recibe una amonestación en el terreno de juego por una falta que requiere sanción progresiva. Después de reiniciarse el juego y de ser sustituido, BLANCO 3 insulta al árbitro desde el banquillo. ¿Decisión correcta?","o":{"a":"Descalificación sin informe escrito de BLANCO 3 (tarjeta roja mostrada por los árbitros) y el equipo BLANCO se reduce en un jugador en pista durante 2 minutos)","b":"Descalificación de BLANCO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros). El equipo se reduce en un jugador en pista durante 2 minutos)","c":"Exclusión de 2 minutos para BLANCO 3 y el equipo BLANCO se reduce en un jugador en pista durante 2 minutos","d":"Tiempo Muerto"},"a":["b","d"]},{"id":"8.20","q":"Durante un contraataque, BLANCO 4, que ya había sido amonestado, sujeta por la camiseta a NEGRO 9. A pesar de ello, NEGRO 9 logra pasar el balón a NEGRO 8 que lanza y marca un gol. Los árbitros quieren sancionar a BLANCO 4 pero éste ya se encuentra sentado en el banquillo. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 4; el equipo BLANCO se reduce en un jugador en pista durante 2 minutos","b":"BLANCO 4 no puede jugar en los próximos 2 minutos pero el equipo permanece completo en el terreno de juego","c":"La sanción ya no es posible","d":"Descalificación para BLANCO 4 (tarjeta roja mostrada por los árbitros), y el equipo BLANCO se reduce en 1 jugador en el terreno de juego durante 2 minutos"},"a":["a"]},{"id":"8.21","q":"¿Cuándo un jugador debe ser descalificado (tarjeta roja o tarjetas roja y azul mostradas por los árbitros)?","o":{"a":"Por conducta antideportiva grave","b":"Por destruir una clara ocasión de gol al interceptar un lanzamiento o pase usando su pie","c":"Por un cambio antirreglamentario durante el tiempo de una exclusión (sin clara ocasión de gol)","d":"Por no dejar el balón en el suelo tras un golpe franco contra su equipo (no en los últimos 30 segundos)"},"a":["a"]},{"id":"8.22","q":"El equipo NEGRO está atacando. BLANCO 11 quita el balón a NEGRO 6 mediante una falta que pone en peligro la integridad física de NEGRO 6. BLANCO 7 y BLANCO 8 se encontraban entre NEGRO 6 y la portería del equipo BLANCO en el momento de la falta. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 11","b":"Descalificación para BLANCO 11 (tarjeta roja mostrada por los árbitros)","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Golpe franco para el equipo NEGRO"},"a":["b","d"]},{"id":"8.23","q":"¿Cuáles de las siguientes infracciones deben ser sancionadas con una descalificación con informe escrito de acuerdo con las Reglas de Juego (tarjeta roja y tarjeta azul mostradas por los árbitros)?","o":{"a":"Un oficial entra dentro del terreno de juego por segunda vez sin permiso de los árbitros","b":"Un oficial intenta forzar a su equipo a abandonar el partido","c":"Cuando un lanzamiento de 7 metros golpea al portero en la cabeza, y el portero no está moviendo la cabeza en la dirección del balón","d":"Después de una decisión arbitral, un jugador lanza el balón claramente hacia la grada","e":"Un jugador fuera del terreno de juego escupe a un espectador"},"a":["b","e"]},{"id":"8.24","q":"BLANCO 3 ha recibido una exclusión de 2 minutos por cometer una falta y está sentado en el banquillo. En el momento de ejecutarse un saque de banda cerca del banquillo, BLANCO 3 grita a los árbitros para insultarlos. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para BLANCO 3","b":"Descalificación para BLANCO 3 (tarjeta roja mostrada por los árbitros), lo cual causa una inmediata reducción de 2 minutos para el equipo BLANCO en el terreno de juego","c":"El equipo BLANCO se reduce en 1 jugador en pista durante 4 minutos","d":"Descalificación para BLANCO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros), lo cual causa una inmediata reducción de 2 minutos para el equipo BLANCO en el terreno de juego"},"a":["d"]},{"id":"8.25","q":"Enfadado por un error, BLANCO 3 da una bofetada en la cara a un compañero. ¿Decisión correcta?","o":{"a":"Ninguna acción, porque se produce sobre un compañero","b":"Exclusión de 2 minutos para BLANCO 3","c":"Descalificación sin informe escrito para BLANCO 3 (tarjeta roja mostrada por los árbitros)","d":"Descalificación para BLANCO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["d"]},{"id":"8.26","q":"Al entrar en el pabellón los árbitros se encuentran con el jugador NEGRO 4, quien ya viste el equipaje, e inmediatamente les dice: “¡No puede ser, estos idiotas otra vez!”. Los árbitros verifican que NEGRO 4 está incluido en el acta del partido. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos para NEGRO 4 al comienzo del partido","b":"Descalificación sin informe escrito para NEGRO 4 (tarjeta roja mostrada por los árbitros), el equipo NEGRO se reduce en 1 jugador en pista durante 2 minutos al comienzo del partido","c":"Descalificación para NEGRO 4, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo NEGRO puede usar 14 jugadores en el partido","d":"Descalificación para NEGRO 4, informe escrito (tarjetas roja y azul mostradas por los árbitros), el equipo NEGRO puede usar 16 jugadores, pero se reduce en un jugador en el terreno durante 2 minutos al comienzo del partido"},"a":["c"]},{"id":"8.27","q":"En el calentamiento antes del partido, el jugador BLANCO 3 y el portero NEGRO 1 chocan por accidente. Los dos jugadores se encaran y NEGRO 1 golpea a BLANCO 3. BLANCO 3 le devuelve el golpe. Ambos jugadores están incluidos en el acta del partido. ¿Decisión correcta?","o":{"a":"Descalificación de NEGRO 1, informe escrito (tarjetas roja y azul mostradas por los árbitros) y exclusión de 2 minutos para BLANCO 3. Los dos equipos pueden usar 16 jugadores en el partido","b":"Descalificación de NEGRO 1 y BLANCO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros). Los equipos pueden usar 16 jugadores en el partido, pero se reducen en 1 jugador en pista durante los 2 primeros minutos al inicio del partido","c":"Ambos jugadores reciben 2 minutos de exclusión, los cuáles deben cumplirse al principio del partido. Informe escrito","d":"Descalificación de NEGRO 1 y BLANCO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros). Los equipos pueden usar 16 jugadores en el partido"},"a":["d"]},{"id":"8.28","q":"BLANCO 9 está realizando un lanzamiento en suspensión. NEGRO 5 agarra por detrás el brazo de lanzamiento de BLANCO 9 y tira de él hacia abajo. NEGRO 10 y NEGRO 11 están entre BLANCO 9 y la portería del equipo NEGRO. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo BLANCO","b":"Lanzamiento de 7 metros para el equipo BLANCO","c":"Descalificación sin informe escrito para NEGRO 5 (tarjeta roja mostrada por los árbitros)","d":"Exclusión de 2 minutos para NEGRO 5","e":"Descalificación de NEGRO 5, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["a","c"]},{"id":"8.29","q":"¿Cuáles de las siguientes infracciones deben ser sancionadas con una descalificación?","o":{"a":"Un oficial entra en el terreno de juego sin autorización por segunda vez","b":"Un jugador en posesión del balón es empujado por detrás mientras corre en contraataque. La situación no es especialmente peligrosa","c":"Lanzamiento de 7 metros a la cara del portero que no está en movimiento en dirección al balón","d":"Después de una decisión arbitral, el jugador lanza el balón a la grada en señal de protesta","e":"El portero abandona el área de portería y consigue la posesión del balón pero choca con un oponente que está corriendo en un contraataque"},"a":["b","d","e"]},{"id":"8.30","q":"BLANCO 9 recibe una descalificación después de su tercera exclusión de 2 minutos. Se pone su chándal y se sienta en la primera fila de la grada, detrás de la línea de banda frente a la zona de cambios del equipo contrario. Justo enfrente suyo, NEGRO 3 comete una acción particularmente peligrosa contra BLANCO 10. El jugador queda lesionado en el suelo. Entonces, antes de que los árbitros puedan sancionar a NEGRO 3, BLANCO 9 penetra corriendo en el terreno de juego y golpea a NEGRO 3 derribándolo. ¿Decisión correcta?","o":{"a":"Tiempo Muerto","b":"Descalificación para NEGRO 3, informe escrito (tarjetas roja y azul mostradas por los árbitros)","c":"BLANCO 9 ya no participa más en el partido, no es posible ninguna observación","d":"Informe escrito sobre el comportamiento de BLANCO 9","e":"Descalificación sin informe escrito para NEGRO 3 (tarjeta roja mostrada por los árbitros)","f":"BLANCO 10 debe abandonar el terreno de juego después de recibir atención médica y solo puede regresar al terreno después del tercer ataque de su equipo."},"a":["a","b","d"]},{"id":"8.31","q":"Una amonestación deberá mostrarse por:","o":{"a":"Infracciones realizadas donde la acción está principal o exclusivamente dirigida al cuerpo del oponente","b":"Infracciones realizadas mientras los oponentes están ejecutando un lanzamiento","c":"No dejar el balón en el suelo después de una decisión contra su propio equipo","d":"El portero intenta realizar un cambio cuando el oponente está listo para ejecutar un lanzamiento de 7 metros"},"a":["a","b","d"]},{"id":"8.32","q":"¿Qué debe considerarse como conducta antideportiva?","o":{"a":"Lanzar el balón a la cara de un defensor que no está en movimiento en dirección al balón","b":"Actitud pasiva del portero durante la ejecución de un lanzamiento de 7 metros, si es evidente que no trata de detener el lanzamiento","c":"Intentar engañar a los árbitros con acciones simuladas","d":"Bloquear intencionadamente un lanzamiento con el pie o la parte inferior de la pierna","e":"Utilización repetida del área de portería por motivos tácticos","f":"Un acto de revancha después de haber recibido una falta."},"a":["c","d","e"]},{"id":"8.33","q":"¿En qué situaciones una descalificación debe ir acompañada de informe escrito (tarjetas roja y azul mostradas por los árbitros)?","o":{"a":"Agresión en el terreno de juego durante el tiempo de descanso","b":"Una acción particularmente imprudente o peligrosa","c":"Un acto de revancha después de haber sufrido una falta","d":"Una acción maliciosa, que no está relacionada con la situación de juego"},"a":["a","b","d"]},{"id":"8.34","q":"Saque de centro a favor del equipo BLANCO. El árbitro ha ordenado la ejecución y el jugador BLANCO 9 está listo para ejecutar el saque. Tras el pitido, el jugador BLANCO 3 cruza la línea central y es derribado por detrás por el jugador NEGRO 5, de tal forma que pierde totalmente el control de su cuerpo. ¿Es correcta la decisión?","o":{"a":"Exclusión de 2 minutos para NEGRO 5","b":"Descalificación sin informe escrito de NEGRO 5 (tarjeta roja mostrada por los árbitros)","c":"Golpe franco para el equipo BLANCO","d":"Lanzamiento de 7 metros para BLANCO","e":"Saque de centro para el equipo BLANCO","f":"Descalificación de NEGRO 5, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["b","c"]},{"id":"8.35","q":"El jugador NEGRO 8 recibe una exclusión de 2 minutos debido a un cambio antirreglamentario. Dos segundos después de que el partido se haya reanudado, realiza un comentario a los árbitros de forma antideportiva desde su posición en el banquillo. ¿Decisión correcta?","o":{"a":"Exclusión de 2 minutos adicionales para NEGRO 8","b":"Descalificación sin informe escrito para NEGRO 8 (tarjeta roja mostrada por los árbitros)","c":"El equipo NEGRO se reduce en 2 jugadores en pista durante 1 min 58 segundos y después en 1 jugador durante dos segundos","d":"El equipo NEGRO se reduce en 2 jugadores en pista durante 2 minutos","e":"Golpe franco para el equipo BLANCO","f":"Tiempo Muerto"},"a":["a","c","e","f"]},{"id":"8.36","q":"El portero BLANCO 1 lanza un pase largo a BLANCO 15, que está corriendo solo hacia la portería contraria. El portero NEGRO 12 abandona su área de portería, salta y coge el balón y choca con BLANCO 15 mientras está en el aire. Ambos jugadores caen al suelo y quedan lesionados. ¿Decisión correcta?","o":{"a":"Tiempo Muerto, exclusión de 2 minutos para BLANCO 15","b":"Tiempo Muerto, exclusión de 2 minutos para NEGRO 12","c":"Tiempo Muerto, descalificación para NEGRO 12","d":"Golpe franco para el equipo BLANCO","e":"Golpe franco para el equipo NEGRO","f":"Lanzamiento de 7 metros para el equipo BLANCO"},"a":["c","f"]},{"id":"8.37","q":"El equipo NEGRO está en posesión del balón. El delegado interrumpe el partido porque el Oficial A del equipo NEGRO ha lanzado una silla hacia el terreno de juego, como protesta a una decisión arbitral. Anteriormente no se había sancionado a los oficiales del equipo NEGRO. NEGRO 7 tenía una clara ocasión de gol cuando el juego fue interrumpido. ¿Decisión correcta?","o":{"a":"Amonestación para el Oficial A del equipo NEGRO","b":"Exclusión de 2 minutos para el Oficial A del equipo NEGRO","c":"Descalificación sin informe escrito para Oficial A del equipo NEGRO (tarjeta roja mostrada por los árbitros)","d":"Golpe franco para el equipo BLANCO","e":"Lanzamiento de 7 metros para el equipo NEGRO","f":"Descalificación para Oficial A del equipo NEGRO, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["d","f"]},{"id":"8.38","q":"El oficial A del equipo BLANCO protesta ruidosamente una decisión de los árbitros contra su equipo y dice: “Sois idiotas”. El oficial C del equipo BLANCO ya había recibido una amonestación 10 minutos antes. ¿Decisión correcta?","o":{"a":"Amonestación al oficial A del equipo BLANCO por conducta antideportiva","b":"Exclusión de 2 minutos para el oficial A del equipo BLANCO. El equipo BLANCO se reduce en 1 jugador en la pista durante 2 minutos","c":"Descalificación para el oficial A del equipo BLANCO, informe escrito (tarjeta roja y tarjeta azul mostradas por los árbitros). El equipo BLANCO se reduce en 1 jugador en la pista durante 2 minutos","d":"Tiempo Muerto"},"a":["c","d"]},{"id":"8.39","q":"El portero BLANCO 1 quiere ejecutar un saque de portería. Por segunda vez, NEGRO 3 entra en el área de portería e intenta impedir que BLANCO 1 ejecute el lanzamiento, sin ningún contacto corporal con él. ¿Decisión correcta?","o":{"a":"Golpe franco para el equipo A después del toque de silbato","b":"Saque de portería para el equipo BLANCO después del toque de silbato","c":"Amonestación para NEGRO 3","d":"Exclusión de 2 minutos para NEGRO 3","e":"Tiempo Muerto"},"a":["a","d","e"]},{"id":"8.40","q":"BLANCO 4 toca el balón que está rodando en el suelo en el área de portería del equipo NEGRO. Después es empujado al suelo por NEGRO 6. ¿Decisión correcta?","o":{"a":"Sanción progresiva para NEGRO 6","b":"Golpe franco para el equipo BLANCO","c":"Saque de portería para el equipo NEGRO","d":"Golpe franco para el equipo NEGRO"},"a":["a","c"]},{"id":"8.41","q":"BLANCO 7 acaba de recibir una exclusión de 2 minutos por conducta antideportiva. Esta es su primera exclusión. 10 segundos después de que el juego ha sido reiniciado, hace evidentes gestos en el banquillo para mostrar, que no está de acuerdo con los árbitros. ¿Decisión correcta?","o":{"a":"Descalificación sin informe escrito de BLANCO 7 (tarjeta roja mostrada por los árbitros)","b":"Exclusión de 2 minutos para BLANCO 7, BLANCO 7 debe permanecer 4 minutos en el banquillo","c":"Exclusión adicional de 2 minutos para BLANCO 7, el equipo BLANCO se reducirá en 2 jugadores en pista durante 1 minuto y 50 segundos y luego en 1 jugador en pista durante 10 segundos","d":"Amonestación porque la sanción progresiva en el banquillo está separada de las sanciones en la pista"},"a":["c"]},{"id":"8.42","q":"BLANCO 6 es empujado por NEGRO 3 y escupe en el suelo delante de NEGRO 3. ¿Cómo debería sancionarse a BLANCO 6?","o":{"a":"Sanción progresiva","b":"Siempre con 2 minutos de exclusión","c":"Descalificación sin informe escrito (tarjeta roja mostrada por los árbitros)","d":"Descalificación, informe escrito (tarjetas roja y azul mostradas por los árbitros)"},"a":["c"]},{"id":"8.43","q":"El portero BLANCO 12 sale corriendo del área de portería hacia el jugador NEGRO 10, quien está corriendo un contraataque. BLANCO 12 consigue ponerse al lado de NEGRO 10 y sujetarle, pero NEGRO 10 es capaz de coger el balón y lanzarlo dentro de la portería vacía. ¿Decisión correcta?","o":{"a":"Saque de centro","b":"Tiempo Muerto","c":"Descalificación para BLANCO 12","d":"Exclusión de 2 minutos para BLANCO 12","e":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["a","b","d"]},{"id":"8.44","q":"El portero BLANCO 12 ejecuta un saque de portería haciendo un pase largo en dirección a su compañero BLANCO 4, quién está corriendo el contraataque. BLANCO 4 salta, recibe el balón e inmediatamente después de hacerlo, choca con el portero NEGRO 1, quien ha decidido abandonar su área de portería en un intento de detener el contraataque. En el momento del choque, NEGRO 1 está completamente inmóvil delante de la línea de 9 metros. Después del choque, BLANCO 4 pierde su equilibrio corporal y cae al suelo. ¿Decisión correcta?","o":{"a":"Falta en ataque – golpe franco para el equipo NEGRO","b":"Golpe franco para el equipo BLANCO","c":"Lanzamiento de 7 metros para el equipo BLANCO","d":"Sanción progresiva para NEGRO 1","e":"Descalificación sin informe escrito para NEGRO 1 (tarjeta roja mostrada por los árbitros)"},"a":["c","e"]},{"id":"8.45","q":"¿Cuál de las siguientes infracciones deben ser sancionadas con una descalificación con informe escrito, conforme a las reglas de juego (tarjetas roja y azul mostradas por los árbitros)?","o":{"a":"Un jugador escupe a un contrario","b":"Un oficial intenta forzar a su equipo para que abandone el partido","c":"Cuando un "o":{"a":"Saque de portería para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO","d":"Exclusión de 2 minutos para BLANCO 2","e":"Tiempo Muerto"},"a":["c","d","e"]},{"id":"8.49","q":"El equipo BLANCO está en ataque y juega con 7 jugadores de pista. BLANCO 4 lanza a portería, pero el portero NEGRO 1 para el balón. NEGRO 1 pasa el balón a NEGRO 9. Justo cuando el portero BLANCO 12 entra en su área de portería, NEGRO 9 intenta lanzar a portería, pero se lo impide una falta de BLANCO 2. El balón sobrepasa la línea exterior de portería. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo BLANCO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros para el equipo NEGRO"},"a":["b"]},{"id":"8.50","q":"El equipo BLANCO está en ataque y juega con 7 jugadores de pista. BLANCO 4 lanza a portería, pero el balón es detenido por el portero NEGRO 1, que está de pie con el balón en su área de portería, listo para ejecutar el saque de portería. En ese momento el delegado interrumpe el juego debido a un cambio antirreglamentario, porque el portero BLANCO 1 entró en la pista antes de que BLANCO 7 hubiera salido. ¿Decisión correcta?","o":{"a":"Saque de portería para el equipo NEGRO después de toque de silbato","b":"Tiempo Muerto","c":"Golpe franco para el equipo NEGRO","d":"Lanzamiento de 7 metros para el equipo NEGRO","e":"Exclusión de 2 minutos para BLANCO 1","f":"Exclusión de 2 minutos para BLANCO 7"},"a":["a","b","e"]},{"id":"8.51","q":"El equipo BLANCO está en ataque y juega con 7 jugadores de pista. BLANCO 4 lanza a portería, pero el balón es detenido por el portero NEGRO 12. NEGRO 12 pasa el balón a NEGRO 9. NEGRO 9 lanza a portería. El jugador de pista BLANCO 10 entra en su área de portería y logra parar el balón. El balón pasa la línea exterior de portería. ¿Decisión correcta?","o":{"a":"Saque de banda para el equipo NEGRO","b":"Golpe franco para el equipo NEGRO","c":"Lanzamiento de 7 metros
